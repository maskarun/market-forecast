<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- theme-color must match --bg below; update both together -->
<meta name="theme-color" content="#0b0e1a">
<title>Stock/Bond/ETF What-If Playground</title>
<style>
  :root {
    --bg: #0b0e1a;
    --surface: #131829;
    --surface-2: #1a2138;
    --border: #2a3350;
    --text: #e8ebf5;
    --text-dim: #8b93ab;
    --text-faint: #5c6480;
    --accent: #6366f1;
    --accent-2: #818cf8;
    --accent-soft: rgba(99,102,241,.15);
    --green: #22c55e;
    --green-soft: rgba(34,197,94,.15);
    --red: #f43f5e;
    --red-soft: rgba(244,63,94,.15);
    --amber: #f59e0b;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
    --header-h: 56px;
    --nav-h: 60px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 640px; margin: 0 auto; position: relative; }

  header.topbar {
    height: calc(var(--header-h) + var(--safe-top)); flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: var(--safe-top) 16px 0; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10;
  }
  header.topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  header.topbar .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .hbtn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .hbtn:hover { color: var(--text); border-color: var(--accent); }

  main.scroll { flex: 1 1 auto; overflow-y: auto; padding: 16px; padding-bottom: 24px; -webkit-overflow-scrolling: touch; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
  .card + .card { margin-top: 0; }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; min-width: 0; }

  input[type=text], input[type=number], input[type=date], input[type=password], select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 10px 12px; font-size: 16px; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .hint { font-size: 11px; color: var(--text-faint); margin-top: 5px; line-height: 1.4; }

  .toggle-pill {
    display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 3px;
  }
  .toggle-pill button {
    flex: 1; border: none; background: transparent; color: var(--text-dim); padding: 8px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s;
  }
  .toggle-pill button.active { background: var(--accent); color: #fff; }

  .checkrow { display: flex; align-items: center; gap: 8px; }
  .checkrow input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .checkrow label { font-size: 13px; color: var(--text); margin: 0; }

  button.primary {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none;
    border-radius: var(--radius-sm); padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  button.secondary {
    width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.secondary:hover { border-color: var(--accent); }
  button.danger { color: var(--red); }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row > * { flex: 1; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .stat .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 17px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat .value.pos { color: var(--green); }
  .stat .value.neg { color: var(--red); }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .badge.pos { background: var(--green-soft); color: var(--green); }
  .badge.neg { background: var(--red-soft); color: var(--red); }
  .badge.neutral { background: var(--accent-soft); color: var(--accent-2); }

  .chart-wrap { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 2px; display: inline-block; background: var(--accent); }
  .legend i.bench { background: var(--amber); }

  .scenario-item {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px; margin-bottom: 10px; cursor: pointer;
  }
  .scenario-item:hover { border-color: var(--accent); }
  .scenario-item .top { display: flex; justify-content: space-between; align-items: center; }
  .scenario-item .ticker { font-weight: 700; font-size: 15px; }
  .scenario-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .scenario-item .actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .scenario-item .actions button { font-size: 11px; padding: 6px 10px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--text-faint); font-size: 13px; }

  .rank-item {
    display: flex; align-items: center; gap: 11px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .rank-item:hover { border-color: var(--accent); }
  .rank-num {
    flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-2);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .rank-body { flex: 1 1 auto; min-width: 0; }
  .rank-ticker { font-size: 14px; font-weight: 700; }
  .rank-name { font-size: 11px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-ret { flex: 0 0 auto; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank-ret.pos { color: var(--green); }
  .rank-ret.neg { color: var(--red); }
  .stale { color: var(--amber); }

  /* --- SWP planner --- */
  .acc-hdr {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0;
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
  }
  .acc-hdr .chev { transition: transform .15s; font-size: 11px; color: var(--text-faint); }
  .acc-hdr[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .acc-body { margin-top: 14px; }
  .err { font-size: 11px; color: var(--red); margin-top: 5px; }
  input.bad, select.bad { border-color: var(--red); }

  .gap-viz { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
  .gap-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .gap-lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
  .gap-gross { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gap-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0 8px; background: var(--bg); }
  .gap-bar i.net { background: var(--green); }
  .gap-bar i.ded { background: var(--red); }
  .gap-ded { font-size: 12px; color: var(--red); font-variant-numeric: tabular-nums; }
  .gap-net-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .gap-net { font-size: 27px; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; letter-spacing: -.5px; }

  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  table.tbl { border-collapse: collapse; width: 100%; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.tbl th, table.tbl td { padding: 6px 9px; text-align: right; border-bottom: 1px solid var(--border); }
  table.tbl th { background: var(--surface-2); color: var(--text-dim); font-weight: 700; position: sticky; top: 0; text-transform: uppercase; font-size: 10px; letter-spacing: .04em; }
  table.tbl td:first-child, table.tbl th:first-child { text-align: left; }
  table.tbl tbody tr:last-child td { border-bottom: none; }
  table.tbl td.pos { color: var(--green); }
  table.tbl td.neg { color: var(--red); }
  .heat { text-align: center; font-weight: 700; color: var(--text); }
  .lot-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .lot-row .field { flex: 1; margin-bottom: 0; }
  .lot-del { flex: 0 0 auto; background: var(--surface-2); border: 1px solid var(--border); color: var(--red); border-radius: var(--radius-sm); padding: 10px 11px; font-size: 13px; cursor: pointer; }
  .preview-box { background: var(--surface-2); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 12px; margin: 12px 0; }
  .preview-box h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-2); }
  .flag { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .flag:last-child { border-bottom: none; }
  .flag-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; margin-top: 5px; }
  .flag-dot.pass { background: var(--green); }
  .flag-dot.watch { background: var(--amber); }
  .flag-dot.concern { background: var(--red); }
  .flag-dot.unknown { background: var(--text-faint); }
  .flag-body { flex: 1; min-width: 0; }
  .flag-title { font-size: 13px; font-weight: 600; }
  .flag-detail { font-size: 11px; color: var(--text-dim); margin-top: 3px; line-height: 1.45; }
  .flag-src { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 6px; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  nav.bottomnav {
    flex: 0 0 auto; height: calc(var(--nav-h) + var(--safe-bottom)); display: flex; border-top: 1px solid var(--border);
    background: var(--bg); position: sticky; bottom: 0; z-index: 10; padding-bottom: var(--safe-bottom);
  }
  .nav-btn {
    flex: 1; background: transparent; border: none; color: var(--text-faint); font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer;
  }
  .nav-btn .ic { font-size: 18px; }
  .nav-btn.active { color: var(--accent-2); }

  #toast-container { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 50; pointer-events: none; }
  .toast {
    max-width: 90%; padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow);
    animation: toastin .2s ease-out; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }
  @keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .spinner {
    width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%;
    display: inline-block; vertical-align: -3px; margin-right: 8px; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-label { font-size: 12px; font-weight: 700; color: var(--accent-2); margin: 4px 0 10px; text-transform: uppercase; letter-spacing: .05em; }
  .divider { height: 1px; background: var(--border); margin: 14px 0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------------
   * Storage keys (versioned so future schema changes can migrate/reset
   * independently of each other).
   * ------------------------------------------------------------------- */
  var STORE = {
    settings: 'stockplay.settings.v1',
    scenarios: 'stockplay.scenarios.v1',
    cache: 'stockplay.pricecache.v1',
    toplists: 'stockplay.toplists.v1',
    topprefs: 'stockplay.topprefs.v1',
    swp: 'stockplay.swp.v1',
    analysis: 'stockplay.analysis.v1',
    holdings: 'stockplay.holdings.v1'
  };

  /* ---------------------------------------------------------------------
   * SWP fund categories. `tax` picks the rate set; `hold` picks which
   * holding-period threshold applies. Debt bought on/after 1 Apr 2023 is
   * taxed at slab regardless of how long it is held, so it has no
   * long-term classification at all.
   * ------------------------------------------------------------------- */
  var SWP_CATEGORIES = [
    { v: 'equity', l: 'Equity (>65% equity)', tax: 'equity', hold: 'eq' },
    { v: 'hybrid_eq', l: 'Hybrid — equity-taxed', tax: 'equity', hold: 'eq' },
    { v: 'hybrid_debt', l: 'Hybrid — debt-taxed', tax: 'debt', hold: 'other' },
    { v: 'debt_new', l: 'Debt (bought on/after 1 Apr 2023)', tax: 'slab_always', hold: null },
    { v: 'debt_legacy', l: 'Debt (legacy, pre 1 Apr 2023)', tax: 'debt', hold: 'other' },
    { v: 'arbitrage', l: 'Arbitrage', tax: 'equity', hold: 'eq' }
  ];
  var SWP_FREQS = [
    { v: 'monthly', l: 'Monthly', perYear: 12, months: 1 },
    { v: 'quarterly', l: 'Quarterly', perYear: 4, months: 3 },
    { v: 'annual', l: 'Annual', perYear: 1, months: 12 }
  ];

  // Placeholders only — Indian rates move at every Budget. The UI says so and
  // every field here is user-editable, per the spec's insistence.
  function defaultRates() {
    return {
      eqStcg: 20, eqLtcg: 12.5, ltcgExemption: 125000,
      debtSlab: 30, cess: 4,
      eqHoldMonths: 12, otherHoldMonths: 24,
      surcharge: [{ over: 5000000, pct: 10 }, { over: 10000000, pct: 15 }]
    };
  }

  var PROVIDERS = {
    openai: { label: 'OpenAI', style: 'openai', defaultUrl: 'https://api.openai.com/v1/chat/completions?model=gpt-4o-mini' },
    anthropic: { label: 'Anthropic', style: 'anthropic', defaultUrl: 'https://api.anthropic.com/v1/messages?model=claude-sonnet-5' },
    openrouter: { label: 'OpenRouter', style: 'openai', defaultUrl: 'https://openrouter.ai/api/v1/chat/completions?model=openai/gpt-4o-mini' },
    gemini: { label: 'Google Gemini', style: 'gemini', defaultUrl: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent' },
    custom: { label: 'Custom (OpenAI-compatible)', style: 'openai', defaultUrl: '' }
  };
  var PROVIDER_ORDER = ['openai', 'anthropic', 'openrouter', 'gemini', 'custom'];
  function providerOf(key) { return PROVIDERS[key] || PROVIDERS.custom; }

  // For openai/anthropic-style providers the model isn't part of the API's own URL shape,
  // so it's carried as a `?model=` query param and stripped before the request is sent.
  function extractModelFromUrl(urlStr) {
    try {
      var u = new URL(urlStr);
      var model = u.searchParams.get('model');
      u.searchParams.delete('model');
      var qs = u.searchParams.toString();
      var cleanUrl = u.origin + u.pathname + (qs ? '?' + qs : '');
      return { model: model, cleanUrl: cleanUrl };
    } catch (e) {
      return { model: null, cleanUrl: urlStr };
    }
  }

  var SYSTEM_PROMPT = [
    'You are a historical securities price lookup service.',
    'Given a ticker symbol, an asset type, and a list of dates, respond with the actual historical closing price',
    '(nominal close, not adjusted) for each requested date, drawn from your knowledge of real market history.',
    'If the market was closed on a requested date (weekend or holiday), use the closing price from the most recent prior trading day, but still key the answer under the ORIGINAL requested date string.',
    'This powers an educational "what if I had invested" calculator — not real-time trading data, not financial advice — so your best good-faith estimate from training knowledge is exactly what is wanted, even without certainty.',
    'You must provide a numeric estimate for EVERY requested date; approximate is expected and acceptable. Only omit a date if the ticker plainly did not exist yet as of that date (e.g. before its IPO).',
    'Quote every price in the security\'s primary listing currency (INR for NSE/BSE-listed securities, USD for US-listed); never convert between currencies.',
    'Respond with STRICT JSON ONLY, no markdown fences, no commentary, in exactly this shape:',
    '{"ticker":"<TICKER>","prices":{"YYYY-MM-DD":<number>, ...}}'
  ].join(' ');

  var TOP_SYSTEM_PROMPT = [
    'You are a market reference for an educational investing sandbox — not live market data and not financial advice.',
    'Given a market, a category and a lookback period, list the ten best-performing widely-recognized securities in that category by approximate total return over that period, drawn from your training knowledge.',
    'Categories: "stocks" = individual listed equities; "index" = index funds / index-tracking ETFs; "mutual" = actively managed mutual funds.',
    'Prefer well-known, currently-listed, broadly available securities a retail investor could actually buy, and use each one\'s real ticker symbol.',
    'Return ONLY securities actually listed and traded in the requested market, using that market\'s conventional ticker symbols — e.g. NSE symbols such as RELIANCE, TCS or INFY for India, and NYSE/NASDAQ symbols for the US.',
    'Indian mutual fund schemes have no exchange ticker: for those, put a short recognizable scheme identifier in "ticker" and the full scheme name in "name".',
    'Give your best good-faith estimate even without certainty; approximate figures are expected and acceptable.',
    'Respond with STRICT JSON ONLY, no markdown fences, no commentary, in exactly this shape:',
    '{"items":[{"ticker":"<TICKER>","name":"<full name>","returnPct":<number>}]}',
    'returnPct is the total percentage return across the whole period, not annualized. Return exactly 10 items, best first.'
  ].join(' ');

  /* The model is asked for what it can genuinely recall, and explicitly forbidden
     from inventing the things a browser-only app cannot know: live order-book depth,
     indicators that need exact daily closes, option contract histories, and future
     earnings dates. Saying "not known" is a valid, wanted answer. */
  var ANALYSIS_SYSTEM_PROMPT = [
    'You are a securities research reference for an educational sandbox — not live market data, not financial advice.',
    'Given a ticker, its market and its asset type, report what you genuinely know from training data.',
    'Do NOT invent any of the following, and never include them even if they seem helpful: RSI, MACD or any indicator requiring exact daily closes; bid/ask or order-book depth; option contract price histories; a specific future earnings date. For the reporting schedule give only the months the company typically reports in.',
    'Where you do not know something, use the string "Not known" (or omit the numeric field) rather than guessing. An honest gap is more useful here than a confident invention.',
    'State in "asOf" what period your knowledge actually covers, and in "note" any material uncertainty.',
    'For an individual company: fill profile, financials (most recent 3 fiscal years, newest first), earnings and valuation.',
    'For an index fund, ETF or mutual fund: fill profile (mandate, what it tracks or holds, typical expense ratio) and leave financials empty, earnings fields "Not known", and valuation numbers omitted — per-share earnings and P/E do not apply.',
    'revenue and netIncome are display strings with their own units (e.g. "₹9,74,864 Cr" or "$391.0B"). netMarginPct, pe and pb are plain numbers.',
    'Also fill the "fund" object when the security is a fund or ETF: expenseRatioPct for the direct/lowest-cost plan, planNote naming which plan that is, the current manager and the date they took over (managerSince as YYYY-MM-DD), assets under management in crore, the SEBI or equivalent category label, the benchmark the scheme is measured against, and the share of the portfolio in its top ten holdings. Omit any of these you do not know — a missing field is treated as unknown, which is the honest outcome; a guessed expense ratio or manager date is not.',
    'For an individual company leave the fund object out entirely.',
    'Respond with STRICT JSON ONLY, no markdown fences, no commentary, in exactly this shape:',
    '{"asOf":"","note":"","profile":{"business":"","sector":"","moat":"","risks":[""]},"financials":[{"period":"","revenue":"","netIncome":"","netMarginPct":0}],"earnings":{"trend":"","beatMissPattern":"","typicalReportingMonths":""},"valuation":{"pe":0,"pb":0,"sectorContext":""},"fund":{"expenseRatioPct":0,"planNote":"","managerName":"","managerSince":"","aumCr":0,"categoryLabel":"","benchmarkName":"","topTenPct":0}}'
  ].join(' ');

  var TOP_CATS_SYSTEM_PROMPT = [
    'You are a market reference for an educational investing sandbox — not live market data and not financial advice.',
    'For each Indian mutual fund tax category listed below, name the five best-performing widely-recognized schemes in that category over the requested period, by approximate total return, from your training knowledge.',
    'The categories are Indian income-tax classifications: "equity" = equity-oriented funds holding over 65% equity; "hybrid_eq" = hybrid funds taxed as equity; "hybrid_debt" = hybrid funds taxed as debt; "debt_new" = debt funds whose units were bought on or after 1 April 2023; "debt_legacy" = debt funds from before that date; "arbitrage" = arbitrage funds.',
    'Use these exact category keys. Cover every category you can. Indian mutual fund schemes have no exchange ticker, so put a short recognizable scheme identifier in "ticker" and the full scheme name in "name".',

  /* A model cannot look anything up — it recalls from training data with a cutoff,
     the same staleness the built-in placeholders warn about. So it is asked to
     declare which Finance Act it thinks it is describing and how sure it is, and
     that provenance is kept with the numbers rather than dropped. */
  var RATES_SYSTEM_PROMPT = [
    'You are a reference for Indian capital-gains taxation of mutual fund redemptions by a non-resident individual (NRI).',
    'Report the rates you believe are currently in force, drawn from your training knowledge.',
    'You cannot browse the internet. State plainly which Finance Act or Budget year your figures come from, and flag your own uncertainty honestly rather than projecting false confidence.',

  /* ---------------------------------------------------------------------
   * State singleton
   * ------------------------------------------------------------------- */
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function yearsAgoISO(n) {
    var d = new Date();
    d.setUTCFullYear(d.getUTCFullYear() - n);
    return d.toISOString().slice(0, 10);
  }

  function defaultDraft() {
    return {
      ticker: '',
      assetType: 'stock',
      currency: 'USD',
      mode: 'lumpsum',
      lumpsum: { amount: 1000, buyDate: yearsAgoISO(1) },

      sellDate: todayISO(),
      bond: { couponRate: 4, faceValue: 1000 },
      benchmark: { enabled: false, ticker: 'SPY' }

  var S = {
    tab: 'new',
    settings: { provider: 'openai', url: PROVIDERS.openai.defaultUrl, apiKey: '' },
    scenarios: [],
    draft: defaultDraft(),
    priceCache: {},
    loading: false,

    topLists: {},
    topLoading: false,

    holdings: {},

    swp: defaultSwp(),

    swpRateFetch: { loading: false, preview: null }
  };

  function defaultSwp() {
    return {
      entryMode: 'lump',
      lots: [{ id: uid(), units: 10000, nav: 100, date: yearsAgoISO(3) }],
      lump: { amount: 5000000, nav: 100, date: yearsAgoISO(3) },
      // The engine grows a single live NAV; the per-lot NAVs above are cost basis only.
      currentNav: 150,
      category: 'equity',
      returns: { pess: 6, base: 10, opt: 13 },
      volatility: { enabled: false, stdev: 15 },
      amount: 50000,
      amountMode: 'net',
      frequency: 'monthly',
      startDate: todayISO(),
      horizonYears: 20,
      escalation: 0,
      residency: 'nri',
      transitionEnabled: false,
      transitionDate: '',
      rates: defaultRates(),
      ratesMeta: { source: 'default', fetchedAt: '', basis: '', note: '', model: '' },

      dtaa: { enabled: false, rate: 0 },

      openSections: { corpus: true, withdrawal: true, tax: false },
      ledgerExpanded: false

  }

  /* ---------------------------------------------------------------------
   * Persistence
   * ------------------------------------------------------------------- */
  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      var parsed = JSON.parse(raw);
      return parsed == null ? fallback : parsed;
    } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage full/unavailable: ignore */ }
  }
  function migrateSettings(raw) {
    if (!raw || raw.url || !raw.baseUrl) return raw;
    var provider = providerOf(raw.provider || 'openai');
    var base = raw.baseUrl.replace(/\/+$/, '');
    var url;
    if (provider.style === 'gemini') {
      url = base;
    } else {
      var path = provider.style === 'anthropic' ? '/messages' : '/chat/completions';
      url = base + path + (raw.model ? '?model=' + encodeURIComponent(raw.model) : '');
    }
    return { provider: raw.provider || 'openai', url: url, apiKey: raw.apiKey || '' };
  }
  // Top-list keys gained a market segment; anything still on the old two-segment
  // shape predates the selector and was implicitly a US-market list.
  function migrateTopLists(raw) {
    if (!raw) return {};
    var out = {}, changed = false;
    Object.keys(raw).forEach(function (k) {
      if (k.split('|').length === 2) { out['us|' + k] = raw[k]; changed = true; }
      else out[k] = raw[k];
    });
    return changed ? out : raw;
  }
  function loadState() {
    var storedRaw = loadJSON(STORE.settings, {});
    var migrated = migrateSettings(storedRaw);
    S.settings = Object.assign({}, S.settings, migrated);
    if (migrated !== storedRaw) saveSettings();
    S.scenarios = loadJSON(STORE.scenarios, []);
    S.priceCache = loadJSON(STORE.cache, {});
    var rawTop = loadJSON(STORE.toplists, {});
    S.topLists = migrateTopLists(rawTop);
    if (S.topLists !== rawTop) saveTopLists();
    S.top = Object.assign({}, S.top, loadJSON(STORE.topprefs, {}));
    if (!S.top.benchmark || typeof S.top.benchmark !== 'object') S.top.benchmark = {};
    S.swp = mergeSwp(loadJSON(STORE.swp, null));
    S.analysis = loadJSON(STORE.analysis, {});
    S.holdings = loadJSON(STORE.holdings, {});
    // `detail` is a transient sub-view, not a saved preference.
    S.top.detail = null;
  }
  // Shallow-merge would drop defaults for any nested field added after a save,
  // so the known sub-objects are merged individually.
  function mergeSwp(saved) {
    var d = defaultSwp();
    if (!saved || typeof saved !== 'object') return d;
    var out = Object.assign({}, d, saved);
    ['returns', 'volatility', 'rates', 'ratesMeta', 'sec197', 'dtaa', 'exitLoad', 'lump', 'openSections'].forEach(function (k) {
      out[k] = Object.assign({}, d[k], saved[k] || {});
    });
    if (!Array.isArray(out.lots) || !out.lots.length) out.lots = d.lots;
    return out;
  }
  function saveSettings() { saveJSON(STORE.settings, S.settings); }
  function saveScenarios() { saveJSON(STORE.scenarios, S.scenarios); }
  function saveCache() { saveJSON(STORE.cache, S.priceCache); }
  function saveTopLists() { saveJSON(STORE.toplists, S.topLists); }
  // `detail` is a transient sub-view, so only the three selectors are persisted.
  function saveTopPrefs() {
    saveJSON(STORE.topprefs, {
      market: S.top.market, category: S.top.category, period: S.top.period,
      benchmark: S.top.benchmark || {}
    });
  }
  function saveSwp() { saveJSON(STORE.swp, S.swp); }
  function saveAnalysis() { saveJSON(STORE.analysis, S.analysis); }
  function saveHoldings() { saveJSON(STORE.holdings, S.holdings); }

  /* ---------------------------------------------------------------------
   * Small utilities
   * ------------------------------------------------------------------- */
  function uid() { return 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
  function getPath(obj, path) {
    var parts = path.split('.'); var cur = obj;
    for (var i = 0; i < parts.length; i++) { if (cur == null) return undefined; cur = cur[parts[i]]; }
    return cur;
  }
  function setPath(obj, path, value) {
    var parts = path.split('.'); var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (typeof cur[parts[i]] !== 'object' || cur[parts[i]] === null) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }
  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtCurrency(amount, currency) {
    if (!Number.isFinite(amount)) return '—';
    try {
      return new Intl.NumberFormat(undefined, { style: 'currency', currency: currency || 'USD', maximumFractionDigits: 2 }).format(amount);
    } catch (e) {
      return (currency || '') + ' ' + amount.toLocaleString(undefined, { maximumFractionDigits: 2 });
    }
  }
  function fmtPercent(pct) {
    if (!Number.isFinite(pct)) return '—';
    return (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso + 'T00:00:00Z');
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function ymd(d) { return d.toISOString().slice(0, 10); }
  function parseISO(iso) { var p = iso.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function addDays(iso, n) { var d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return ymd(d); }
  function addMonths(iso, n) {
    var p = iso.split('-').map(Number);
    var target = new Date(Date.UTC(p[0], p[1] - 1 + n, 1));
    var daysInMonth = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
    var day = Math.min(p[2], daysInMonth);
    target.setUTCDate(day);
    return ymd(target);
  }
  function diffYears(startIso, endIso) {
    var ms = parseISO(endIso).getTime() - parseISO(startIso).getTime();
    return ms / (1000 * 60 * 60 * 24 * 365.25);
  }

  /* ---------------------------------------------------------------------
   * Scheduling: recurring/DCA contribution dates & chart sample dates
   * ------------------------------------------------------------------- */
  function generateSchedule(start, end, freq) {
    if (!start || !end || start > end) return [start].filter(Boolean);
    var dates = [];
    if (freq === 'weekly') {
      var d = start;
      while (d <= end && dates.length < 200) { dates.push(d); d = addDays(d, 7); }
    } else {
      var stepMonths = freq === 'quarterly' ? 3 : 1;
      var i = 0;
      while (dates.length < 200) {
        var dd = addMonths(start, i * stepMonths);
        if (dd > end) break;
        dates.push(dd);
        i++;
      }
    }
    if (dates.length === 0) dates.push(start);
    return dates;
  }

  function contributionDates(draft) {
    return draft.mode === 'dca'
      ? generateSchedule(draft.dca.startDate, draft.dca.endDate, draft.dca.frequency)
      : [draft.lumpsum.buyDate];
  }

  function sampleDates(draft) {
    var start = draft.mode === 'dca' ? draft.dca.startDate : draft.lumpsum.buyDate;
    var end = draft.sellDate;
    var grid = generateSchedule(start, end, 'monthly');
    var contribs = contributionDates(draft);
    var set = {};
    grid.concat(contribs, [start, end]).forEach(function (d) { if (d) set[d] = true; });
    return Object.keys(set).sort().slice(0, 80);
  }

  /* ---------------------------------------------------------------------
   * LLM price oracle
   * ------------------------------------------------------------------- */
  function cacheKey(ticker, date) { return ticker + '|' + date; }

  function extractJSON(text) {
    try { return JSON.parse(text); } catch (e) {}
    var m = text.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
    return null;
  }

  function llmChatRequest(systemPrompt, userContent) {
    var provider = providerOf(S.settings.provider);
    var rawUrl = (S.settings.url || '').trim();
    if (!rawUrl || !S.settings.apiKey) {
      return Promise.reject(new Error('Configure a Provider, URL, and API Key in Settings before running a scenario.'));
    }
    var url, headers, body;
    if (provider.style === 'gemini') {
      url = rawUrl;
      headers = { 'Content-Type': 'application/json', 'x-goog-api-key': S.settings.apiKey };
      body = {
        contents: [{ role: 'user', parts: [{ text: userContent }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: { temperature: 0 }
      };
    } else if (provider.style === 'anthropic') {
      var pa = extractModelFromUrl(rawUrl);
      if (!pa.model) return Promise.reject(new Error('Add ?model=<name> to the end of the URL, e.g. …/messages?model=claude-sonnet-5.'));
      url = pa.cleanUrl;
      headers = {
        'Content-Type': 'application/json',
        'x-api-key': S.settings.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      };
      // A ceiling, not a cost — only generated tokens bill. 1024 truncated the
      // grouped 30-fund reply into a parse failure.
      body = { model: pa.model, max_tokens: 4096, temperature: 0, system: systemPrompt, messages: [{ role: 'user', content: userContent }] };
    } else {
      var po = extractModelFromUrl(rawUrl);
      if (!po.model) return Promise.reject(new Error('Add ?model=<name> to the end of the URL, e.g. …/chat/completions?model=gpt-4o-mini.'));
      url = po.cleanUrl;
      headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.settings.apiKey };
      body = { model: po.model, temperature: 0, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userContent }] };
    }
    return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) })
      .catch(function (err) {
        throw new Error('Network error calling the LLM endpoint. If your provider blocks direct browser (CORS) requests, this "bring your own endpoint" approach cannot work around that without a backend proxy. (' + err.message + ')');
      })
      .then(function (res) {
        if (!res.ok) {
          return res.text().then(function (t) {
            throw new Error('LLM request failed: ' + res.status + ' ' + res.statusText + (t ? ' — ' + t.slice(0, 200) : ''));
          });
        }
        return res.json();
      })
      .then(function (data) {
        var content;
        if (provider.style === 'gemini') {
          content = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
        } else if (provider.style === 'anthropic') {
          content = data && data.content && data.content[0] && data.content[0].text;
        } else {
          content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        }
        if (!content) throw new Error('LLM response did not contain a message to parse.');
        return content;
      });
  }

  function fetchPrices(ticker, dates) {
    var needed = dates.filter(function (d) { return !(cacheKey(ticker, d) in S.priceCache); });
    if (needed.length === 0) return Promise.resolve();
    var userContent = JSON.stringify({ ticker: ticker, assetType: S.draft.assetType, dates: needed });
    return llmChatRequest(SYSTEM_PROMPT, userContent).then(function (content) {
      var parsed = extractJSON(content);
      if (!parsed || !parsed.prices) throw new Error('Could not parse price JSON from the model response.');
      var any = false;
      Object.keys(parsed.prices).forEach(function (date) {
        var num = Number(parsed.prices[date]);
        if (Number.isFinite(num) && num > 0) { S.priceCache[cacheKey(ticker, date)] = num; any = true; }
      });
      if (!any) throw new Error('The model declined to estimate any prices for ' + ticker + '. Some models are more conservative about this than others — try a different model/provider, or a date range further in the past.');
      saveCache();
    });
  }

  function getPricesMap(ticker, dates) {
    var out = {}; var missing = [];
    dates.forEach(function (d) {
      var key = cacheKey(ticker, d);
      if (key in S.priceCache) { out[d] = S.priceCache[key]; return; }
      var found = null;
      for (var back = 1; back <= 7 && !found; back++) {
        var k2 = cacheKey(ticker, addDays(d, -back));
        if (k2 in S.priceCache) found = S.priceCache[k2];
      }
      if (found != null) out[d] = found; else missing.push(d);
    });
    if (missing.length) throw new Error('Missing price data for ' + ticker + ' on: ' + missing.slice(0, 5).join(', ') + (missing.length > 5 ? '…' : ''));
    return out;
  }

  /* ---------------------------------------------------------------------
   * Deterministic financial math
   * ------------------------------------------------------------------- */
  function computeLumpSum(draft, prices) {
    var buyPrice = prices[draft.lumpsum.buyDate];
    var sellPrice = prices[draft.sellDate];
    var shares = draft.lumpsum.amount / buyPrice;
    var currentValue = shares * sellPrice;
    var investedTotal = draft.lumpsum.amount;
    var gainAbs = currentValue - investedTotal;
    return {
      contributions: [{ date: draft.lumpsum.buyDate, amount: investedTotal, price: buyPrice, shares: shares }],
      investedTotal: investedTotal, totalShares: shares, avgCost: buyPrice,
      sellPrice: sellPrice, currentValue: currentValue, gainAbs: gainAbs, gainPct: (gainAbs / investedTotal) * 100
    };
  }

  function computeDCA(draft, prices) {
    var dates = contributionDates(draft);
    var investedTotal = 0, totalShares = 0, contributions = [];
    dates.forEach(function (d) {
      var p = prices[d];
      var sh = draft.dca.amount / p;
      investedTotal += draft.dca.amount; totalShares += sh;
      contributions.push({ date: d, amount: draft.dca.amount, price: p, shares: sh });
    });
    var sellPrice = prices[draft.sellDate];
    var currentValue = totalShares * sellPrice;
    var gainAbs = currentValue - investedTotal;
    return {
      contributions: contributions, investedTotal: investedTotal, totalShares: totalShares,
      avgCost: investedTotal / totalShares, sellPrice: sellPrice, currentValue: currentValue,
      gainAbs: gainAbs, gainPct: (gainAbs / investedTotal) * 100
    };
  }

  function computeBase(draft, prices) {
    return draft.mode === 'dca' ? computeDCA(draft, prices) : computeLumpSum(draft, prices);
  }

  function computeBondAddon(draft, base) {
    var startDate = draft.mode === 'dca' ? draft.dca.startDate : draft.lumpsum.buyDate;
    var years = Math.max(0, diffYears(startDate, draft.sellDate));
    var principal = draft.bond.faceValue > 0 ? draft.bond.faceValue : base.investedTotal;
    var couponIncome = principal * (draft.bond.couponRate / 100) * years;
    var totalReturnAbs = base.gainAbs + couponIncome;
    return {
      years: years, couponIncome: couponIncome, totalReturnAbs: totalReturnAbs,
      totalReturnPct: (totalReturnAbs / base.investedTotal) * 100
    };
  }

  function buildChartSeries(draft, base, prices, benchBase, benchPrices) {
    var dates = sampleDates(draft);
    return dates.map(function (d) {
      var sharesSoFar = 0;
      base.contributions.forEach(function (c) { if (c.date <= d) sharesSoFar += c.shares; });
      var value = (sharesSoFar > 0 && prices[d]) ? sharesSoFar * prices[d] : null;
      var benchValue = null;
      if (benchBase && benchPrices) {
        var bShares = 0;
        benchBase.contributions.forEach(function (c) { if (c.date <= d) bShares += c.shares; });
        benchValue = (bShares > 0 && benchPrices[d]) ? bShares * benchPrices[d] : null;
      }
      return { date: d, value: value, benchValue: benchValue };
    });
  }

  /* ---------------------------------------------------------------------
   * Validation
   * ------------------------------------------------------------------- */
  function validateDraft(draft) {
    if (!draft.ticker || !draft.ticker.trim()) throw new Error('Enter a ticker symbol.');
    if (!draft.sellDate || draft.sellDate > todayISO()) throw new Error('Sell date must be today or in the past.');
    if (draft.mode === 'lumpsum') {
      if (!(draft.lumpsum.amount > 0)) throw new Error('Purchase amount must be greater than 0.');
      if (!draft.lumpsum.buyDate || draft.lumpsum.buyDate > todayISO()) throw new Error('Buy date must be today or in the past.');
      if (draft.lumpsum.buyDate >= draft.sellDate) throw new Error('Buy date must be before the sell date.');
    } else {
      if (!(draft.dca.amount > 0)) throw new Error('Contribution amount must be greater than 0.');
      if (!draft.dca.startDate || !draft.dca.endDate || draft.dca.startDate > draft.dca.endDate) throw new Error('DCA start date must be before end date.');
      if (draft.dca.endDate > draft.sellDate) throw new Error('DCA end date cannot be after the sell date.');
      if (draft.dca.startDate > todayISO()) throw new Error('DCA start date must be today or in the past.');
    }
    if (draft.assetType === 'bond') {
      if (!(draft.bond.couponRate >= 0)) throw new Error('Coupon rate must be 0 or greater.');
      if (!(draft.bond.faceValue >= 0)) throw new Error('Face value must be 0 or greater.');
    }
    if (draft.benchmark.enabled && !draft.benchmark.ticker.trim()) throw new Error('Enter a benchmark ticker or disable the benchmark comparison.');
  }

  /* ---------------------------------------------------------------------
   * Actions
   * ------------------------------------------------------------------- */
  function runScenario() {
    var draft = S.draft;
    try { validateDraft(draft); } catch (err) { toast('error', err.message); return; }
    draft.ticker = draft.ticker.trim().toUpperCase();
    if (draft.benchmark.enabled) draft.benchmark.ticker = draft.benchmark.ticker.trim().toUpperCase();

    S.loading = true; S.activeError = null; render();
    var dates = sampleDates(draft);

    fetchPrices(draft.ticker, dates)
      .then(function () {
        return draft.benchmark.enabled ? fetchPrices(draft.benchmark.ticker, dates) : null;
      })
      .then(function () {
        var prices = getPricesMap(draft.ticker, dates);
        var base = computeBase(draft, prices);
        var bond = draft.assetType === 'bond' ? computeBondAddon(draft, base) : null;
        var benchBase = null, benchPrices = null;
        if (draft.benchmark.enabled) {
          benchPrices = getPricesMap(draft.benchmark.ticker, dates);
          benchBase = computeBase(draft, benchPrices);
        }
        var chartSeries = buildChartSeries(draft, base, prices, benchBase, benchPrices);
        S.activeResult = { base: base, bond: bond, benchBase: benchBase, chartSeries: chartSeries, computedAt: new Date().toISOString() };
        toast('success', 'Prices loaded for ' + draft.ticker + '.');
      })
      .catch(function (err) {
        S.activeResult = null;
        toast('error', err.message || 'Failed to fetch prices.');
      })
      .then(function () { S.loading = false; render(); });
  }

  function saveScenario() {
    if (!S.activeResult) { toast('error', 'Run the scenario before saving it.'); return; }
    var scenario = {
      id: uid(),
      createdAt: new Date().toISOString(),
      draft: JSON.parse(JSON.stringify(S.draft)),
      result: JSON.parse(JSON.stringify(S.activeResult))
    };
    S.scenarios.unshift(scenario);
    saveScenarios();
    toast('success', 'Scenario saved.');
    S.tab = 'history';
    render();
  }

  function loadScenario(id) {
    var sc = S.scenarios.filter(function (s) { return s.id === id; })[0];
    if (!sc) return;
    S.draft = JSON.parse(JSON.stringify(sc.draft));
    S.activeResult = JSON.parse(JSON.stringify(sc.result));
    S.tab = 'new';
    render();
  }

  function deleteScenario(id) {
    S.scenarios = S.scenarios.filter(function (s) { return s.id !== id; });
    saveScenarios();
    render();
  }

  function testConnection() {
    if (!S.settings.url || !S.settings.apiKey) {
      toast('error', 'Fill in Provider, URL, and API Key first.'); return;
    }
    S.loading = true; render();
    llmChatRequest('You are a helpful assistant.', 'Reply with the single word: ok')
      .then(function () { toast('success', 'Connection OK.'); })
      .catch(function (err) { toast('error', 'Connection failed: ' + err.message); })
      .then(function () { S.loading = false; render(); });
  }

  function clearCache() {
    S.priceCache = {}; saveCache(); toast('success', 'Price cache cleared.');
  }

  /* ---------------------------------------------------------------------
   * Top-10 leaderboards. Unlike historical prices (fixed facts), "best
   * performers" is a question about current data, so results are only as
   * fresh as the model's training cutoff — surfaced in the UI, not hidden.
   * ------------------------------------------------------------------- */
  function topKey(market, category, period) { return market + '|' + category + '|' + period; }

  function normalizeTopItems(raw, limit) {
    return (Array.isArray(raw) ? raw : []).slice(0, limit).map(function (it) {
      return {
        ticker: String(it && it.ticker == null ? '' : it.ticker).trim().toUpperCase(),
        name: String(it && it.name == null ? '' : it.name).trim(),
        returnPct: Number(it && it.returnPct)
      };
    }).filter(function (it) { return it.ticker || it.name; });
  }

  function fetchTopList() {
    var t = S.top;
    var key = topKey(t.market, t.category, t.period);
    var grouped = t.category === 'swpcats';
    S.topLoading = true; render();
    var userContent = JSON.stringify(grouped
      ? { market: 'India', categories: SWP_CATEGORIES.map(function (c) { return c.v; }), period: topOption(TOP_PERIODS, t.period).prompt }
      : {
        market: topOption(TOP_MARKETS, t.market).prompt,
        category: t.category,
        period: topOption(TOP_PERIODS, t.period).prompt
      });

    llmChatRequest(grouped ? TOP_CATS_SYSTEM_PROMPT : TOP_SYSTEM_PROMPT, userContent).then(function (content) {
      var parsed = extractJSON(content);
      if (grouped) {
        if (!parsed || !Array.isArray(parsed.groups)) throw new Error('Could not parse the per-category lists from the model response.');
        var byCat = {};
        parsed.groups.forEach(function (g) {
          if (!g || !g.category) return;
          var items = normalizeTopItems(g.items, 5);
          if (items.length) byCat[String(g.category).trim()] = items;
        });
        // Keep whatever came back rather than failing the lot; missing categories
        // are reported in the UI.
        var groups = SWP_CATEGORIES.filter(function (c) { return byCat[c.v]; })
          .map(function (c) { return { category: c.v, items: byCat[c.v] }; });
        if (!groups.length) throw new Error('The model returned no usable fund entries.');
        S.topLists[key] = { fetchedAt: new Date().toISOString(), groups: groups };
        saveTopLists();
        var total = groups.reduce(function (s, g) { return s + g.items.length; }, 0);
        toast('success', 'Loaded ' + total + ' funds across ' + groups.length + ' categories.');
      } else {
        if (!parsed || !Array.isArray(parsed.items)) throw new Error('Could not parse a top-10 list from the model response.');
        var flat = normalizeTopItems(parsed.items, 10).filter(function (it) { return it.ticker; });
        if (!flat.length) throw new Error('The model returned no usable entries for this list.');
        S.topLists[key] = { fetchedAt: new Date().toISOString(), items: flat };
        saveTopLists();
        toast('success', 'Loaded ' + flat.length + ' results.');
      }
    }).catch(function (err) {
      toast('error', err.message || 'Failed to load the list.');
    }).then(function () { S.topLoading = false; render(); });
  }

  /* ---------------------------------------------------------------------
   * Stock detail panel. Two sources, kept strictly separate: the model
   * supplies qualitative recall (profile, financials, earnings, valuation),
   * while every number in the stats block is computed here in JS from the
   * price series. Nothing numeric is echoed from the model.
   * ------------------------------------------------------------------- */
  function cleanStr(v, max) {
    var s = String(v == null ? '' : v).trim();
    return s ? s.slice(0, max || 400) : '';
  }
  function boundedNum(v, lo, hi) {
    var n = Number(v);
    return Number.isFinite(n) && n >= lo && n <= hi ? n : null;
  }
  // Descriptive text, so this degrades to "not available" rather than rejecting
  // the payload the way the tax-rate sanitiser does.
  function sanitizeAnalysis(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var p = raw.profile || {}, e = raw.earnings || {}, v = raw.valuation || {};
    return {
      asOf: cleanStr(raw.asOf, 160),
      note: cleanStr(raw.note, 400),
      profile: {
        business: cleanStr(p.business, 900),
        sector: cleanStr(p.sector, 120),
        moat: cleanStr(p.moat, 600),
        risks: (Array.isArray(p.risks) ? p.risks : []).slice(0, 6)
          .map(function (r) { return cleanStr(r, 240); }).filter(Boolean)
      },
      financials: (Array.isArray(raw.financials) ? raw.financials : []).slice(0, 5)
        .map(function (f) {
          return {
            period: cleanStr(f && f.period, 40),
            revenue: cleanStr(f && f.revenue, 40),
            netIncome: cleanStr(f && f.netIncome, 40),
            netMarginPct: boundedNum(f && f.netMarginPct, -1000, 1000)
          };
        }).filter(function (f) { return f.period; }),
      earnings: {
        trend: cleanStr(e.trend, 500),
        beatMissPattern: cleanStr(e.beatMissPattern, 500),
        typicalReportingMonths: cleanStr(e.typicalReportingMonths, 160)
      },
      valuation: {
        pe: boundedNum(v.pe, 0, 10000),
        pb: boundedNum(v.pb, 0, 10000),
        sectorContext: cleanStr(v.sectorContext, 500)
      },
      fund: sanitizeFund(raw.fund)
    };
  }
  // A field that fails its bounds becomes null, which the flag builder renders as
  // "not known" rather than letting a bad value pass as evidence.
  function sanitizeFund(f) {
    if (!f || typeof f !== 'object') return null;
    var since = cleanStr(f.managerSince, 20);
    var out = {
      expenseRatioPct: boundedNum(f.expenseRatioPct, 0, 10),
      planNote: cleanStr(f.planNote, 80),
      managerName: cleanStr(f.managerName, 120),
      managerSince: /^\d{4}-\d{2}-\d{2}$/.test(since) && since <= todayISO() ? since : '',
      aumCr: boundedNum(f.aumCr, 0, 1e9),
      categoryLabel: cleanStr(f.categoryLabel, 120),
      benchmarkName: cleanStr(f.benchmarkName, 120),
      topTenPct: boundedNum(f.topTenPct, 0, 100)
    };
    var any = Object.keys(out).some(function (k) { return out[k] !== null && out[k] !== ''; });
    return any ? out : null;
  }

  function defaultBenchmark(market) { return market === 'in' ? 'NIFTY 50' : 'SPY'; }
  function activeBenchmark(market) {
    var over = S.top.benchmark && S.top.benchmark[market];
    return (over && String(over).trim()) || defaultBenchmark(market);
  }

  // Month-end dates spanning `years` back from today, oldest first.
  function monthlyDates(years) {
    var end = todayISO(), out = [];
    for (var i = years * 12; i >= 0; i--) out.push(addMonths(end, -i));
    return out;
  }

  /* Every figure below is derived from the price series, not asked of the model.
     Monthly granularity is what the oracle can supply honestly, so the trend
     measure is a 10-month average — the standard monthly proxy for the 200-day. */
  function computePriceStats(series) {
    var pts = series.filter(function (p) { return Number.isFinite(p.price) && p.price > 0; });
    if (pts.length < 2) return null;
    var last = pts[pts.length - 1], first = pts[0];
    var at = function (monthsBack) {
      var i = pts.length - 1 - monthsBack;
      return i >= 0 ? pts[i] : null;
    };
    var retOver = function (monthsBack) {
      var p = at(monthsBack);
      return p ? (last.price / p.price - 1) * 100 : null;
    };
    var years = Math.max(1 / 12, (pts.length - 1) / 12);
    var cagr = first.price > 0 ? (Math.pow(last.price / first.price, 1 / years) - 1) * 100 : null;

    var peak = -Infinity, maxDD = 0;
    pts.forEach(function (p) {
      if (p.price > peak) peak = p.price;
      var dd = (p.price / peak - 1) * 100;
      if (dd < maxDD) maxDD = dd;
    });

    var rets = [];
    for (var i = 1; i < pts.length; i++) rets.push(Math.log(pts[i].price / pts[i - 1].price));
    var mean = rets.reduce(function (a, b) { return a + b; }, 0) / (rets.length || 1);
    var variance = rets.length > 1
      ? rets.reduce(function (a, r) { return a + (r - mean) * (r - mean); }, 0) / (rets.length - 1) : 0;
    var vol = Math.sqrt(variance) * Math.sqrt(12) * 100;

    var window = pts.slice(-10);
    var sma10 = window.reduce(function (a, p) { return a + p.price; }, 0) / window.length;

    return {
      points: pts, last: last, spanMonths: pts.length - 1,
      ret6m: retOver(6), ret1y: retOver(12), ret5y: retOver(60),
      cagr: cagr, maxDrawdown: maxDD, volatility: vol,
      sma10: sma10, vsSma10: (last.price / sma10 - 1) * 100, smaMonths: window.length
    };
  }

  /* ---------------------------------------------------------------------
   * Evidence layer. Point-to-point returns depend entirely on their two
   * endpoints, so these look at every overlapping window instead, and at how
   * the security behaves when the benchmark falls. All computed here; the
   * model contributes nothing numeric to this block.
   * ------------------------------------------------------------------- */
  function alignSeries(a, b) {
    var byDate = {};
    b.forEach(function (p) { if (Number.isFinite(p.price) && p.price > 0) byDate[p.date] = p.price; });
    var out = [];
    a.forEach(function (p) {
      if (Number.isFinite(p.price) && p.price > 0 && byDate[p.date]) {
        out.push({ date: p.date, fund: p.price, bench: byDate[p.date] });
      }
    });
    return out;
  }
  function median(arr) {
    if (!arr.length) return null;
    var s = arr.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // Every overlapping window of `months`, so a single lucky start date cannot
  // carry the result the way a point-to-point figure can.
  function rollingWindows(pairs, months) {
    if (pairs.length <= months) return null;
    var wins = [];
    for (var i = 0; i + months < pairs.length; i++) {
      var s = pairs[i], e = pairs[i + months];
      var f = (e.fund / s.fund - 1) * 100;
      var b = (e.bench / s.bench - 1) * 100;
      wins.push({ start: s.date, end: e.date, fund: f, bench: b, excess: f - b });
    }
    var beat = wins.filter(function (w) { return w.excess > 0; }).length;
    var worst = wins.reduce(function (a, w) { return w.fund < a.fund ? w : a; }, wins[0]);
    return {
      months: months, count: wins.length, windows: wins,
      beatRate: beat / wins.length * 100,
      medianFund: median(wins.map(function (w) { return w.fund; })),
      medianExcess: median(wins.map(function (w) { return w.excess; })),
      worst: worst,
      best: wins.reduce(function (a, w) { return w.fund > a.fund ? w : a; }, wins[0])
    };
  }

  function monthlyPairReturns(pairs) {
    var out = [];
    for (var i = 1; i < pairs.length; i++) {
      out.push({
        fund: pairs[i].fund / pairs[i - 1].fund - 1,
        bench: pairs[i].bench / pairs[i - 1].bench - 1
      });
    }
    return out;
  }

  // Average participation in rising vs falling benchmark months. Under 100 on the
  // downside is the property worth paying an active fee for.
  function captureRatios(pairs) {
    var r = monthlyPairReturns(pairs);
    var up = r.filter(function (x) { return x.bench > 0; });
    var down = r.filter(function (x) { return x.bench < 0; });
    var avg = function (list, k) {
      return list.length ? list.reduce(function (a, x) { return a + x[k]; }, 0) / list.length : null;
    };
    var ub = avg(up, 'bench'), db = avg(down, 'bench');
    return {
      upMonths: up.length, downMonths: down.length,
      upCapture: ub ? avg(up, 'fund') / ub * 100 : null,
      downCapture: db ? avg(down, 'fund') / db * 100 : null
    };
  }

  // Depth matters, but whether it has recovered — and how long that took —
  // matters more when the money has a horizon.
  function drawdownDetail(series) {
    var pts = series.filter(function (p) { return Number.isFinite(p.price) && p.price > 0; });
    if (pts.length < 2) return null;
    var peak = pts[0].price, peakDate = pts[0].date;
    var worst = { dd: 0, peakDate: pts[0].date, troughDate: pts[0].date, peakPrice: peak };
    pts.forEach(function (p) {
      if (p.price > peak) { peak = p.price; peakDate = p.date; }
      var dd = (p.price / peak - 1) * 100;
      if (dd < worst.dd) worst = { dd: dd, peakDate: peakDate, troughDate: p.date, peakPrice: peak };
    });
    if (worst.dd === 0) return { maxDD: 0, recovered: true, recoveryMonths: 0 };
    var troughIdx = pts.findIndex(function (p) { return p.date === worst.troughDate; });
    var recoveryDate = null;
    for (var i = troughIdx + 1; i < pts.length; i++) {
      if (pts[i].price >= worst.peakPrice) { recoveryDate = pts[i].date; break; }
    }
    var peakIdx = pts.findIndex(function (p) { return p.date === worst.peakDate; });
    var recIdx = recoveryDate ? pts.findIndex(function (p) { return p.date === recoveryDate; }) : -1;
    return {
      maxDD: worst.dd, peakDate: worst.peakDate, troughDate: worst.troughDate,
      recovered: !!recoveryDate, recoveryDate: recoveryDate,
      recoveryMonths: recIdx >= 0 ? recIdx - peakIdx : null,
      monthsSinceTrough: pts.length - 1 - troughIdx
    };
  }

  function betaOf(pairs) {
    var r = monthlyPairReturns(pairs);
    if (r.length < 3) return null;
    var mf = r.reduce(function (a, x) { return a + x.fund; }, 0) / r.length;
    var mb = r.reduce(function (a, x) { return a + x.bench; }, 0) / r.length;
    var cov = 0, varB = 0, varF = 0;
    r.forEach(function (x) {
      cov += (x.fund - mf) * (x.bench - mb);
      varB += (x.bench - mb) * (x.bench - mb);
      varF += (x.fund - mf) * (x.fund - mf);
    });
    if (varB === 0) return null;
    return {
      beta: cov / varB,
      correlation: varF > 0 ? cov / Math.sqrt(varB * varF) : null
    };
  }

  function computeEvidence(fundSeries, benchSeries) {
    var pairs = alignSeries(fundSeries, benchSeries);
    if (pairs.length < 14) return null;
    return {
      pairs: pairs.length,
      from: pairs[0].date, to: pairs[pairs.length - 1].date,
      rolling: { r12: rollingWindows(pairs, 12), r36: rollingWindows(pairs, 36), r60: rollingWindows(pairs, 60) },
      capture: captureRatios(pairs),
      drawdown: drawdownDetail(fundSeries),
      beta: betaOf(pairs)
    };
  }

  /* Thresholds are conventional, not authoritative — every flag renders the
     measured value and the cut-off applied so a reader can disagree with it. */
  var EVIDENCE_THRESHOLDS = {
    beatRate: { pass: 60, watch: 40 },
    downCapture: { pass: 100, watch: 110 },
    expense: { pass: 1, watch: 1.75 },
    tenureYears: 3
  };

  function buildEvidenceFlags(ev, fund, benchLabel) {
    var T = EVIDENCE_THRESHOLDS, flags = [];
    var r36 = ev && ev.rolling.r36;

    if (r36) {
      var br = r36.beatRate;
      flags.push({
        level: br >= T.beatRate.pass ? 'pass' : br >= T.beatRate.watch ? 'watch' : 'concern',
        title: 'Beat ' + benchLabel + ' in ' + br.toFixed(0) + '% of rolling 3-year windows',
        detail: r36.count + ' overlapping windows. Pass at ≥' + T.beatRate.pass + '%, concern below ' + T.beatRate.watch + '%.'
      });
      flags.push({
        level: r36.medianExcess > 0.5 ? 'pass' : r36.medianExcess > -0.5 ? 'watch' : 'concern',
        title: 'Median 3-year excess return ' + fmtPercent(r36.medianExcess),
        detail: 'Typical window returned ' + fmtPercent(r36.medianFund) + ' against the benchmark. Pass above 0.'
      });
      flags.push({
        level: 'unknown',
        title: 'Worst 3-year window: ' + fmtPercent(r36.worst.fund),
        detail: 'Ending ' + fmtDate(r36.worst.end) + '. Context, not a pass or fail — it shows what a bad entry point looked like.'
      });
    } else {
      flags.push({ level: 'unknown', title: 'Not enough history for rolling 3-year windows', detail: 'Needs at least 37 month-end points for the fund and its benchmark.' });
    }

    if (ev && ev.capture && ev.capture.downCapture != null) {
      var dc = ev.capture.downCapture;
      flags.push({
        level: dc < T.downCapture.pass ? 'pass' : dc <= T.downCapture.watch ? 'watch' : 'concern',
        title: 'Downside capture ' + dc.toFixed(0) + '%',
        detail: 'Across ' + ev.capture.downMonths + ' falling months' +
          (ev.capture.upCapture != null ? ', against ' + ev.capture.upCapture.toFixed(0) + '% upside capture' : '') +
          '. Pass below ' + T.downCapture.pass + '%, concern above ' + T.downCapture.watch + '%.' +
          // A negative ratio is legitimate but reads oddly, so name what it means.
          (dc < 0 ? ' Negative means it rose on average in the months the benchmark fell.' : '')
      });
    }

    var dd = ev && ev.drawdown;
    if (dd && dd.maxDD < 0) {
      flags.push({
        level: dd.recovered ? 'pass' : 'watch',
        title: 'Deepest fall ' + fmtPercent(dd.maxDD) + (dd.recovered ? ', recovered' : ', not yet recovered'),
        detail: dd.recovered
          ? 'Peak ' + fmtDate(dd.peakDate) + ' → trough ' + fmtDate(dd.troughDate) + ', back to the old high in ' + dd.recoveryMonths + ' months.'
          : 'Trough ' + fmtDate(dd.troughDate) + ', still below the ' + fmtDate(dd.peakDate) + ' high ' + dd.monthsSinceTrough + ' months on.'
      });
    }

    // Recall-sourced. An unknown stays unknown rather than quietly passing.
    var f = fund || {};
    if (f.expenseRatioPct != null) {
      var er = f.expenseRatioPct;
      flags.push({
        level: er < T.expense.pass ? 'pass' : er <= T.expense.watch ? 'watch' : 'concern',
        title: 'Expense ratio ' + er.toFixed(2) + '%' + (f.planNote ? ' (' + f.planNote + ')' : ''),
        detail: 'Pass below ' + T.expense.pass + '%, concern above ' + T.expense.watch + '%. Cost predicts relative performance more reliably than past returns do.',
        recall: true
      });
    } else {
      flags.push({ level: 'unknown', title: 'Expense ratio not known', detail: 'The model did not report one. Check the scheme factsheet — this is the single most reliable predictor available.', recall: true });
    }

    if (f.managerSince) {
      var yrs = monthsBetween(f.managerSince, todayISO()) / 12;
      flags.push({
        level: yrs >= T.tenureYears ? 'pass' : 'watch',
        title: 'Manager tenure ' + yrs.toFixed(1) + ' years' + (f.managerName ? ' (' + f.managerName + ')' : ''),
        detail: yrs >= T.tenureYears
          ? 'Since ' + fmtDate(f.managerSince) + '. The record above was largely built under this manager.'
          : 'Since ' + fmtDate(f.managerSince) + '. Much of the track record above predates them — pass at ≥' + T.tenureYears + ' years.',
        recall: true
      });
    } else {
      flags.push({ level: 'unknown', title: 'Manager tenure not known', detail: 'A change of manager can invalidate a long track record, so this is worth checking directly.', recall: true });
    }

    return flags;
  }

  /* ---- Tax-lot block: exact arithmetic on lots the user enters, since this
     data lives in a brokerage account and cannot be fetched here. ---- */
  function holdingFor(ticker) {
    var h = S.holdings[ticker];
    return {
      lots: (h && Array.isArray(h.lots) ? h.lots : []),
      priceOverride: h && h.priceOverride != null ? h.priceOverride : ''
    };
  }
  function holdingPrice(ticker, stats) {
    var h = holdingFor(ticker);
    var manual = Number(h.priceOverride);
    if (Number.isFinite(manual) && manual > 0) return manual;
    return stats && stats.last ? stats.last.price : null;
  }

  // Equities use the equity holding threshold from the SWP rate panel.
  var EQUITY_TAX_CAT = { tax: 'equity', hold: 'eq' };

  function analyseLots(ticker, stats, market) {
    var h = holdingFor(ticker);
    var price = holdingPrice(ticker, stats);
    var rates = S.swp.rates;
    var today = todayISO();
    var indian = market === 'in';
    var lots = h.lots.map(function (l) {
      var units = Number(l.units) || 0, cost = Number(l.price) || 0;
      var basis = units * cost;
      var value = price != null ? units * price : null;
      var gain = value == null ? null : value - basis;
      var months = l.date ? monthsBetween(l.date, today) : 0;
      var lt = isLongTerm(EQUITY_TAX_CAT, months, rates);
      var threshold = Number(rates.eqHoldMonths) || 12;
      return {
        id: l.id, units: units, cost: cost, date: l.date, basis: basis, value: value,
        gain: gain, months: months, lt: lt,
        ltOn: l.date ? addMonths(l.date, threshold) : ''
      };
    }).filter(function (l) { return l.units > 0 && l.date; });

    if (!lots.length) return { lots: [], price: price, indian: indian };

    var totals = lots.reduce(function (a, l) {
      a.units += l.units; a.basis += l.basis;
      a.value += l.value || 0; a.gain += l.gain || 0;
      if (l.gain > 0) { if (l.lt) a.ltGain += l.gain; else a.stGain += l.gain; }
      return a;
    }, { units: 0, basis: 0, value: 0, gain: 0, stGain: 0, ltGain: 0 });

    var tax = null, taxIfWaited = null, shortLots = lots.filter(function (l) { return !l.lt && l.gain > 0; });
    if (indian && price != null) {
      tax = estimateEquityTax(totals.stGain, totals.ltGain, rates);
      // Same gains, but with the short-term lots reclassified as long-term.
      taxIfWaited = estimateEquityTax(0, totals.stGain + totals.ltGain, rates);
    }
    var crossing = shortLots.slice().sort(function (a, b) { return a.ltOn < b.ltOn ? -1 : 1; })[0];
    return {
      lots: lots, totals: totals, price: price, indian: indian, tax: tax,
      taxIfWaited: taxIfWaited,
      saving: tax != null && taxIfWaited != null ? tax - taxIfWaited : null,
      nextCrossing: crossing || null
    };
  }

  // Mirrors the SWP engine's treatment: exemption on long-term gains, then
  // surcharge on the aggregate and cess on top.
  function estimateEquityTax(stGain, ltGain, rates) {
    var exemption = Number(rates.ltcgExemption) || 0;
    var taxableLt = Math.max(0, ltGain - Math.min(exemption, ltGain));
    var taxableSt = Math.max(0, stGain);
    var base = taxableSt * baseRateFor(EQUITY_TAX_CAT, false, rates) / 100
      + taxableLt * baseRateFor(EQUITY_TAX_CAT, true, rates) / 100;
    var sur = surchargePct(rates.surcharge, taxableSt + taxableLt);
    return base * (1 + sur / 100) * (1 + (Number(rates.cess) || 0) / 100);
  }

  function useSwpCategory(cat) {
    S.swp.category = cat;
    S.swpRateFetch.preview = null;
    saveSwp();
    S.tab = 'swp';
    render();
    toast('success', topOption(SWP_CATEGORIES, cat).l + ' set in the SWP planner.');
  }

  // Only ever invoked from a Top-tab row, so the selected market determines the
  // currency label the What-If form should carry over.
  function openAnalysis(ticker, name) {
    S.top.detail = { ticker: ticker, name: name || '' };
    S.detailFetch = { loading: false, priceError: '', analysisError: '' };
    render();
    if (!S.analysis[ticker]) fetchAnalysis(ticker);
    else render();
  }
  function closeAnalysis() { S.top.detail = null; render(); }

  // Both calls fire together: qualitative analysis, and the price series the
  // stats are computed from. One failing does not block the other.
  function fetchAnalysis(ticker) {
    var d = S.top.detail;
    if (!d) return;
    S.detailFetch = { loading: true, priceError: '', analysisError: '' };
    render();
    var assetType = S.top.category === 'stocks' ? 'individual listed company'
      : S.top.category === 'index' ? 'index fund or ETF' : 'mutual fund';
    var market = topOption(TOP_MARKETS, S.top.market);
    var dates = monthlyDates(5);

    var analysisCall = llmChatRequest(ANALYSIS_SYSTEM_PROMPT, JSON.stringify({
      ticker: ticker, name: d.name, market: market.prompt, assetType: assetType
    })).then(function (content) {
      var clean = sanitizeAnalysis(extractJSON(content));
      if (!clean) throw new Error('Could not parse the analysis from the model response.');
      S.analysis[ticker] = Object.assign({
        fetchedAt: new Date().toISOString(), model: currentModelLabel()
      }, clean);
      saveAnalysis();
    }).catch(function (err) { S.detailFetch.analysisError = err.message || 'Analysis failed.'; });

    var priceCall = fetchPrices(ticker, dates)
      .catch(function (err) { S.detailFetch.priceError = err.message || 'Price lookup failed.'; });

    Promise.all([analysisCall, priceCall]).then(function () {
      S.detailFetch.loading = false;
      render();
      if (S.detailFetch.analysisError && S.detailFetch.priceError) toast('error', 'Could not load this stock.');
    });
  }

  /* Ten years of month-end prices for the security *and* its benchmark — two calls,
     so this is opt-in rather than firing when the panel opens. */
  function runEvidence(ticker) {
    var market = S.top.market;
    var bench = activeBenchmark(market);
    var dates = monthlyDates(10);
    S.detailFetch.evidenceLoading = true;
    S.detailFetch.evidenceError = '';
    render();
    Promise.all([
      fetchPrices(ticker, dates),
      fetchPrices(bench, dates)
    ]).then(function () {
      var ev = computeEvidence(seriesFrom(ticker, dates), seriesFrom(bench, dates));
      if (!ev) throw new Error('Not enough overlapping price history to compare against ' + bench + '.');
      S.analysis[ticker] = Object.assign({}, S.analysis[ticker], {
        evidence: ev, evidenceBenchmark: bench, evidenceAt: new Date().toISOString()
      });
      saveAnalysis();
      toast('success', 'Compared ' + ev.pairs + ' months against ' + bench + '.');
    }).catch(function (err) {
      S.detailFetch.evidenceError = err.message || 'Could not run the comparison.';
      toast('error', S.detailFetch.evidenceError);
    }).then(function () { S.detailFetch.evidenceLoading = false; render(); });
  }
  function seriesFrom(ticker, dates) {
    return dates.map(function (dt) {
      var k = cacheKey(ticker, dt);
      return { date: dt, price: k in S.priceCache ? S.priceCache[k] : null };
    });
  }

  // Reads whatever the shared price cache already has; no network here.
  function detailPriceStats(ticker) {
    var series = monthlyDates(5).map(function (dt) {
      var key = cacheKey(ticker, dt);
      return { date: dt, price: key in S.priceCache ? S.priceCache[key] : null };
    });
    return computePriceStats(series);
  }

  function useTicker(ticker) {
    S.draft.ticker = ticker;
    S.draft.currency = topOption(TOP_MARKETS, S.top.market).currency;
    S.activeResult = null;
    S.tab = 'new';
    render();
    toast('success', ticker + ' loaded into the What-If form.');
  }

  /* ---------------------------------------------------------------------
   * SWP engine. Entirely deterministic and offline — no LLM, no API.
   * The whole point is that gross ≠ net for an NRI, so every rupee of
   * exit load and TDS is tracked per instalment, per FIFO lot slice.
   * ------------------------------------------------------------------- */
  function swpCategory(cfg) { return topOption(SWP_CATEGORIES, cfg.category); }
  function swpFreq(cfg) { return topOption(SWP_FREQS, cfg.frequency); }

  function monthsBetween(fromIso, toIso) {
    var a = parseISO(fromIso), b = parseISO(toIso);
    var m = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth());
    if (b.getUTCDate() < a.getUTCDate()) m--;
    return m;
  }
  function daysBetween(fromIso, toIso) {
    return Math.round((parseISO(toIso).getTime() - parseISO(fromIso).getTime()) / 86400000);
  }
  // Indian financial year runs 1 Apr – 31 Mar; FY 2025 means 2025-04-01..2026-03-31.
  function finYearOf(iso) {
    var d = parseISO(iso);
    return d.getUTCMonth() >= 3 ? d.getUTCFullYear() : d.getUTCFullYear() - 1;
  }
  function finYearLabel(fy) { return 'FY ' + fy + '–' + String(fy + 1).slice(2); }

  // Lots normalised to {units, nav (cost basis), date}, oldest first for FIFO.
  function swpLots(cfg) {
    var list;
    if (cfg.entryMode === 'lump') {
      var nav = Number(cfg.lump.nav) || 0;
      list = [{ units: nav > 0 ? (Number(cfg.lump.amount) || 0) / nav : 0, nav: nav, date: cfg.lump.date }];
    } else {
      list = (cfg.lots || []).map(function (l) {
        return { units: Number(l.units) || 0, nav: Number(l.nav) || 0, date: l.date };
      });
    }
    return list.filter(function (l) { return l.units > 0 && l.nav > 0 && l.date; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function swpCorpusValue(cfg) {
    var units = swpLots(cfg).reduce(function (s, l) { return s + l.units; }, 0);
    return units * (Number(cfg.currentNav) || 0);
  }

  // Spec: with a transition set, before it apply NRI rules, on/after apply resident.
  function swpIsNriOn(cfg, date) {
    if (cfg.transitionEnabled && cfg.transitionDate) return date < cfg.transitionDate;
    return cfg.residency === 'nri';
  }
  function isLongTerm(cat, holdMonths, rates) {
    if (!cat.hold) return false; // debt bought on/after 1 Apr 2023: slab always
    var threshold = cat.hold === 'eq' ? Number(rates.eqHoldMonths) : Number(rates.otherHoldMonths);
    return holdMonths >= threshold;
  }
  function baseRateFor(cat, isLong, rates) {
    if (cat.tax === 'slab_always') return Number(rates.debtSlab) || 0;
    if (cat.tax === 'equity') return Number(isLong ? rates.eqLtcg : rates.eqStcg) || 0;
    return Number(rates.debtSlab) || 0;
  }
  // Surcharge keys off cumulative FY gains, not the single instalment — charging it
  // per instalment would understate the deduction at higher gain levels.
  function surchargePct(slabs, fyGains) {
    var pct = 0;
    (slabs || []).forEach(function (s) {
      if (fyGains > Number(s.over)) pct = Math.max(pct, Number(s.pct) || 0);
    });
    return pct;
  }

  /* Non-mutating: the net-mode solver calls this repeatedly for one instalment.
     Caller applies the returned unit deductions. */
  function simulateRedemption(gross, lots, nav, date, cfg, exemptionLeft, fyGains) {
    var cat = swpCategory(cfg), rates = cfg.rates;
    var remaining = nav > 0 ? gross / nav : 0;
    var slices = [], cost = 0, stGain = 0, ltGain = 0, exitLoad = 0, units = 0;
    for (var i = 0; i < lots.length && remaining > 1e-9; i++) {
      if (lots[i].units <= 1e-9) continue;
      var take = Math.min(lots[i].units, remaining);
      remaining -= take; units += take;
      var proceeds = take * nav, basis = take * lots[i].nav, gain = proceeds - basis;
      var lt = isLongTerm(cat, monthsBetween(lots[i].date, date), rates);
      var load = daysBetween(lots[i].date, date) < (Number(cfg.exitLoad.days) || 0)
        ? proceeds * (Number(cfg.exitLoad.pct) || 0) / 100 : 0;
      cost += basis; exitLoad += load;
      if (lt) ltGain += gain; else stGain += gain;
      slices.push({ lot: i, units: take, basis: basis, gain: gain, lt: lt, load: load });
    }
    // LTCG annual exemption applies to equity-taxed long-term gains.
    var exemptionUsed = 0, taxableLt = ltGain;
    if (cat.tax === 'equity' && ltGain > 0) {
      exemptionUsed = Math.min(exemptionLeft, ltGain);
      taxableLt = ltGain - exemptionUsed;
    }
    var taxableSt = Math.max(0, stGain);
    taxableLt = Math.max(0, taxableLt);
    var tax;
    if (cfg.sec197.enabled || cfg.dtaa.enabled) {
      // A certificate/treaty rate is the all-in deduction; no surcharge or cess on top.
      var ovr = Number(cfg.sec197.enabled ? cfg.sec197.rate : cfg.dtaa.rate) || 0;
      tax = (taxableSt + taxableLt) * ovr / 100;
    } else {
      var base = taxableSt * baseRateFor(cat, false, rates) / 100
        + taxableLt * baseRateFor(cat, true, rates) / 100;
      var sur = surchargePct(rates.surcharge, fyGains + taxableSt + taxableLt);
      tax = base * (1 + sur / 100) * (1 + (Number(rates.cess) || 0) / 100);
    }
    var actualGross = units * nav;
    var isNri = swpIsNriOn(cfg, date);
    return {
