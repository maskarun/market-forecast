      var el = document.querySelector('[data-bind="' + focusKey + '"]');
      if (el) {
        el.focus();
        if (selStart != null) { try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* ditto */ } }
      }
    }
  }

  /* ---------------------------------------------------------------------
   * Event delegation
   * ------------------------------------------------------------------- */
  function onClick(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'set-tab') { S.tab = el.dataset.value; render(); }
    else if (action === 'set-mode') { S.draft.mode = el.dataset.value; render(); }
    else if (action === 'run') { runScenario(); }
    else if (action === 'save-scenario') { saveScenario(); }
    else if (action === 'load-scenario') { loadScenario(el.dataset.id); }
    else if (action === 'delete-scenario') { e.stopPropagation(); if (confirm('Delete this saved scenario?')) deleteScenario(el.dataset.id); }
    else if (action === 'test-connection') { testConnection(); }
    else if (action === 'clear-cache') { if (confirm('Clear all cached prices?')) clearCache(); }
    else if (action === 'set-top-market') {
      S.top.market = el.dataset.value;
      // The tax-category view is India-only; don't leave the UI on an option
      // that no longer exists for the selected market.
      if (S.top.category === 'swpcats' && S.top.market !== 'in') S.top.category = 'stocks';
      saveTopPrefs(); render();
    }
    else if (action === 'set-top-category') { S.top.category = el.dataset.value; saveTopPrefs(); render(); }
    else if (action === 'set-top-period') { S.top.period = el.dataset.value; saveTopPrefs(); render(); }
    else if (action === 'fetch-top') { fetchTopList(); }
    else if (action === 'use-ticker') { useTicker(el.dataset.ticker); }
    else if (action === 'use-swp-category') { useSwpCategory(el.dataset.category); }
    else if (action === 'open-analysis') { openAnalysis(el.dataset.ticker, el.dataset.name); }
    else if (action === 'close-analysis') { closeAnalysis(); }
    else if (action === 'refresh-analysis') { fetchAnalysis(el.dataset.ticker); }
    else if (action === 'analysis-what-if') { useTicker(el.dataset.ticker); }
    else if (action === 'run-evidence') { runEvidence(el.dataset.ticker); }
    else if (action === 'use-suggested-benchmark') {
      S.top.benchmark[el.dataset.market] = el.dataset.value;
      saveTopPrefs(); render();
    }
    else if (action === 'add-holding-lot') {
      var tk = el.dataset.ticker;
      if (!S.holdings[tk]) S.holdings[tk] = { lots: [], priceOverride: '' };
      S.holdings[tk].lots.push({ id: uid(), units: '', price: '', date: todayISO() });
      saveHoldings(); render();
    }
    else if (action === 'remove-holding-lot') {
      var rt = el.dataset.ticker;
      if (S.holdings[rt]) { S.holdings[rt].lots.splice(Number(el.dataset.index), 1); saveHoldings(); render(); }
    }
    else if (action === 'swp-toggle-section') { S.swp.openSections[el.dataset.key] = !S.swp.openSections[el.dataset.key]; saveSwp(); render(); }
    else if (action === 'swp-entry-mode') { S.swp.entryMode = el.dataset.value; saveSwp(); render(); }
    else if (action === 'swp-amount-mode') { S.swp.amountMode = el.dataset.value; saveSwp(); render(); }
    else if (action === 'swp-residency') { S.swp.residency = el.dataset.value; saveSwp(); render(); }
    else if (action === 'swp-add-lot') { S.swp.lots.push({ id: uid(), units: 1000, nav: 100, date: yearsAgoISO(1) }); saveSwp(); render(); }
    else if (action === 'swp-remove-lot') { S.swp.lots.splice(Number(el.dataset.index), 1); saveSwp(); render(); }
    else if (action === 'swp-toggle-ledger') { S.swp.ledgerExpanded = !S.swp.ledgerExpanded; saveSwp(); render(); }
    else if (action === 'swp-export-csv') { swpExportCsv(); }
    else if (action === 'swp-fetch-rates') { fetchSwpRates(); }
    else if (action === 'swp-apply-rates') { applySwpRates(); }
    else if (action === 'swp-discard-rates') { discardSwpRates(); }
    else if (action === 'swp-reset-rates') { if (confirm('Reset tax rates to the built-in defaults?')) resetSwpRates(); }
  }

  function onProviderChange(newProviderKey) {
    var oldProvider = providerOf(S.settings.provider);
    var newProvider = providerOf(newProviderKey);
    if (!S.settings.url || S.settings.url === oldProvider.defaultUrl) S.settings.url = newProvider.defaultUrl;
    S.settings.provider = newProviderKey;
    saveSettings();
    render();
  }

  function onFormChange(e) {
    var el = e.target.closest('[data-bind]');
    if (!el) return;
    var path = el.dataset.bind;
    var value;
    if (el.type === 'checkbox') value = el.checked;
    else if (el.type === 'number') value = el.value === '' ? 0 : Number(el.value);
    else value = el.value;

    if (path === 'settings.provider') { onProviderChange(value); return; }
    if (path.indexOf('settings.') === 0) { setPath(S, path, value); saveSettings(); return; }
    // SWP recalculates live on every input, per the spec. Raw strings are stored so
    // partial entry ("", "1.") types naturally; the engine coerces at every use.
    if (path.indexOf('top.benchmark.') === 0) { setPath(S, path, el.value); saveTopPrefs(); render(); return; }
    // Holdings recalculate live like the SWP inputs, and store raw strings for the
    // same reason — partial entry has to type naturally.
    if (path.indexOf('holdings.') === 0) {
      setPath(S, path, el.type === 'checkbox' ? el.checked : el.value);
      saveHoldings();
      if (!(el.type === 'date' && e.type === 'input')) render();
      return;
    }
    if (path.indexOf('swp.') === 0) {
      setPath(S, path, el.type === 'checkbox' ? el.checked : el.value);
      saveSwp();
      // Date inputs are segmented — re-rendering per keystroke fights the picker,
      // so those settle on 'change' instead.
      if (!(el.type === 'date' && e.type === 'input')) render();
      return;
    }
    setPath(S.draft, path, value);

    var structural = path === 'assetType' || path === 'benchmark.enabled';
    if (structural) render();
  }

  /* ---------------------------------------------------------------------
   * Init
   * ------------------------------------------------------------------- */
  function init() {
    loadState();
    document.getElementById('app').addEventListener('click', onClick);
    document.getElementById('app').addEventListener('input', onFormChange);
    document.getElementById('app').addEventListener('change', onFormChange);
    render();
  }

  init();
})();
</script>
</body>
</html>
