    html += '<div class="section-label">First 12 months</div>';
    html += '<div class="stat-grid">';
    html += stat('Redeemed', fmtINR(y1.g));
    html += stat('Deducted', fmtINR(y1.d), y1.d > 0 ? 'neg' : '');
    html += stat('Received', fmtINR(y1.n), 'pos');
    html += stat('Lost to deduction', (y1.g > 0 ? (y1.d / y1.g * 100).toFixed(2) : '0.00') + '%', y1.d > 0 ? 'neg' : '');
    html += '</div>';

    html += '<div class="divider"></div>';
    html += '<div class="section-label">How long the corpus lasts</div>';
    html += '<div class="stat-grid">';
    [['pess', 'Pessimistic'], ['base', 'Base'], ['opt', 'Optimistic']].forEach(function (p) {
      var out = runs[p[0]];
      html += stat(p[1] + ' · ' + Number(c.returns[p[0]]) + '%',
        out.survives ? 'Survives' : fmtDate(out.depletion), out.survives ? 'pos' : 'neg');
    });
    html += stat('Ending balance (base)', fmtINR(runs.base.endingValue), runs.base.survives ? 'pos' : '');
    html += '</div>';

    if (c.transitionEnabled && c.transitionDate) {
      var asNri = runSwp(Object.assign({}, c, { transitionEnabled: false, residency: 'nri' }), Number(c.returns.base));
      var asRes = runSwp(Object.assign({}, c, { transitionEnabled: false, residency: 'resident' }), Number(c.returns.base));
      var sumNet = function (o) { return o.ledger.reduce(function (s, r) { return s + r.net; }, 0); };
      html += '<div class="divider"></div>';
      html += '<div class="section-label">Same plan, either status</div>';
      html += '<div class="stat-grid">';
      html += stat('Total received as NRI', fmtINR(sumNet(asNri)));
      html += stat('Total received as resident', fmtINR(sumNet(asRes)), 'pos');
      html += stat('Cost of NRI status', fmtINR(sumNet(asRes) - sumNet(asNri)), 'neg');
      html += stat('Transition', fmtDate(c.transitionDate));
      html += '</div>';
      html += '<div class="hint">Resident figures are what is credited; the tax still falls due at ITR time rather than being withheld per instalment.</div>';
    }
    html += '</div>';
    return html;
  }

  function renderSwpChart(c, runs) {
    var series = [
      { key: 'pess', color: '#f43f5e', out: runs.pess },
      { key: 'base', color: '#818cf8', out: runs.base },
      { key: 'opt', color: '#22c55e', out: runs.opt }
    ];
    var maxLen = Math.max.apply(null, series.map(function (s) { return s.out.ledger.length; }));
    if (maxLen < 2) return '<div class="empty">Not enough instalments to chart.</div>';
    var maxVal = Math.max.apply(null, series.map(function (s) {
      return Math.max.apply(null, s.out.ledger.map(function (r) { return r.remainingValue; }).concat([0]));
    }));
    if (!(maxVal > 0)) maxVal = 1;
    var W = 600, H = 220, pad = 30;
    var xAt = function (i) { return pad + (i / Math.max(1, maxLen - 1)) * (W - 2 * pad); };
    var yAt = function (v) { return H - pad - (v / maxVal) * (H - 2 * pad); };

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Corpus over time under three return scenarios">';
    svg += '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="#2a3350"/>';

    if (c.transitionEnabled && c.transitionDate) {
      var ti = runs.base.ledger.findIndex(function (r) { return r.date >= c.transitionDate; });
      if (ti > 0) {
        svg += '<line x1="' + xAt(ti).toFixed(1) + '" y1="' + pad + '" x2="' + xAt(ti).toFixed(1) + '" y2="' + (H - pad) +
          '" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>';
        svg += '<text x="' + (xAt(ti) + 4).toFixed(1) + '" y="' + (pad + 10) + '" font-size="9" fill="#f59e0b">residency change</text>';
      }
    }
    series.forEach(function (s) {
      var d = s.out.ledger.map(function (r, i) { return (i ? 'L' : 'M') + xAt(i).toFixed(1) + ',' + yAt(r.remainingValue).toFixed(1); }).join(' ');
      svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2"/>';
      if (!s.out.survives && s.out.ledger.length) {
        var li = s.out.ledger.length - 1;
        svg += '<circle cx="' + xAt(li).toFixed(1) + '" cy="' + yAt(s.out.ledger[li].remainingValue).toFixed(1) + '" r="3.5" fill="' + s.color + '"/>';
      }
    });
    svg += '<text x="' + pad + '" y="14" font-size="10" fill="#8b93ab">' + escapeHTML(fmtINR(maxVal)) + '</text>';
    svg += '<text x="' + pad + '" y="' + (H - 8) + '" font-size="10" fill="#8b93ab">' + escapeHTML(fmtDate(runs.base.ledger[0].date)) + '</text>';
    svg += '<text x="' + (W - pad) + '" y="' + (H - 8) + '" font-size="10" fill="#8b93ab" text-anchor="end">+' + Math.round(maxLen / swpFreq(c).perYear) + 'y</text>';
    svg += '</svg>';
    return svg;
  }

  var SWP_LEDGER_COLS = [
    ['Date', function (r) { return fmtDate(r.date); }],
    ['NAV', function (r) { return r.nav.toFixed(2); }],
    ['Gross', function (r) { return fmtINR(r.gross); }],
    ['Units', function (r) { return r.units.toFixed(3); }],
    ['Cost', function (r) { return fmtINR(r.cost); }],
    ['ST gain', function (r) { return fmtINR(r.stGain); }],
    ['LT gain', function (r) { return fmtINR(r.ltGain); }],
    ['Exempt', function (r) { return fmtINR(r.exemptionUsed); }],
    ['Load', function (r) { return fmtINR(r.exitLoad); }],
    ['TDS', function (r) { return fmtINR(r.tds); }],
    ['Net', function (r) { return fmtINR(r.net); }],
    ['Units left', function (r) { return r.remainingUnits.toFixed(3); }],
    ['Value left', function (r) { return fmtINR(r.remainingValue); }]
  ];

  function renderSwpDetail(c, runs) {
    var base = runs.base;
    var html = '<div class="card"><h2>Corpus over time</h2>';

  function swpExportCsv() {
    var c = S.swp;
    if (Object.keys(validateSwp(c)).length) { toast('error', 'Fix the highlighted inputs first.'); return; }
    var out = runSwp(c, Number(c.returns.base));
    var head = ['Date', 'FinancialYear', 'NAV', 'Gross', 'Units', 'CostBasis', 'STGain', 'LTGain',
      'ExemptionUsed', 'ExitLoad', 'TDS', 'Liability', 'NetCredit', 'RemainingUnits', 'RemainingValue'];
    var lines = [head.join(',')].concat(out.ledger.map(function (r) {
      return [r.date, finYearLabel(r.fy), r.nav.toFixed(4), r.gross.toFixed(2), r.units.toFixed(4),

  function fetchSleeveCandidates() {
    var market = S.top.market;
    S.sleevesFetch = { loading: true, error: '' };
    render();
    var groundingOut = {};
    llmChatRequest(SLEEVE_SYSTEM_PROMPT, JSON.stringify({
      market: topOption(TOP_MARKETS, market).prompt,
      sleeves: ASSET_CLASSES.map(function (c) { return { key: c.v, label: c.l }; })
    }), groundingOut).then(function (content) {
      var parsed = extractJSON(content);
      if (!parsed || !Array.isArray(parsed.sleeves)) throw new Error('Could not parse fund candidates from the model response.');
      var out = {};
      parsed.sleeves.forEach(function (s) {
        if (!s || !s.sleeve) return;
        var list = sanitizeCandidates(s.candidates);
        if (list.length) out[String(s.sleeve).trim()] = list;
      });
      if (!Object.keys(out).length) throw new Error('The model returned no usable candidates.');
      S.sleeves[market] = {
        fetchedAt: new Date().toISOString(), model: currentModelLabel(), grounded: groundingOut.grounded || null,
        asOf: cleanStr(parsed.asOf, 160), note: cleanStr(parsed.note, 400), sleeves: out
      };
      saveSleeves();
      toast('success', 'Candidates for ' + Object.keys(out).length + ' sleeves.');
    }).catch(function (err) {
      S.sleevesFetch.error = err.message || 'Could not fetch candidates.';
      toast('error', S.sleevesFetch.error);
    }).then(function () { S.sleevesFetch.loading = false; render(); });

  // Four calls, not five: cash is a flat assumption, not fetched.
  function runHorizonBacktest() {
    var market = S.top.market;
    var proxies = activeProxies(market);
    var horizon = Number(S.portfolio.btHorizon) || 7;
    var hurdle = S.portfolio.btHurdle != null ? Number(S.portfolio.btHurdle) : 6;
    var cashRate = Number(S.portfolio.btCashRate) || 6;
    // Enough span for a dozen-plus overlapping windows even at a 10-year horizon.
    var years = Math.max(horizon + 18, 25);
    var dates = annualDates(years);
    var keys = ['eq_in', 'eq_intl', 'debt', 'gold'];
    var tickers = keys.map(function (k) { return proxies[k]; });

    S.btFetch = { loading: true, error: '' };
    render();
    Promise.all(tickers.map(function (t) { return fetchPrices(t, dates); }))
      .then(function () {
        var proxySeries = {};
        keys.forEach(function (k) { proxySeries[k] = seriesFrom(proxies[k], dates); });

        var compareDefs = HORIZONS.map(function (h) { return { label: h.l, targets: h.targets }; })
          .concat([{ label: 'Your targets', targets: S.portfolio.targets }]);
        var compare = compareDefs.map(function (d) {
          var bt = backtestMix(d.targets, proxySeries, dates, cashRate, horizon, hurdle);
          return { label: d.label, rolling: bt.rolling, drawdown: bt.drawdown, hurdleSharePct: bt.hurdleSharePct };
        });
        if (!compare.some(function (c) { return c.rolling; })) {
          throw new Error('Not enough overlapping history at this horizon — try a shorter one.');
        }

        var sweep = sweepEquity(S.portfolio.targets).map(function (s) {
          var bt = backtestMix(s.targets, proxySeries, dates, cashRate, horizon, hurdle);
          return { equityPct: s.equityPct, rolling: bt.rolling, drawdown: bt.drawdown };
        });

        var withCount = compare.filter(function (c) { return c.rolling; })[0];
        S.btResult = {
          fetchedAt: new Date().toISOString(), years: years, horizon: horizon, hurdle: hurdle,
          compare: compare, sweep: sweep, windowCount: withCount ? withCount.rolling.count : 0
        };
        // The full result (price series, every window) stays in memory only, like
        // S.portfolioResult — but a lightweight timestamp is worth persisting so a
        // reload can say when this last ran instead of looking like it never has.
        S.portfolio.btAt = S.btResult.fetchedAt;
        savePortfolio();
        toast('success', 'Compared ' + (withCount ? withCount.rolling.count : 0) + ' overlapping ' + horizon + '-year windows.');
      })
      .catch(function (err) {
        S.btFetch.error = err.message || 'Could not run the backtest.';
        toast('error', S.btFetch.error);
      })
      .then(function () { S.btFetch.loading = false; render(); });
  }

    html += '</tbody></table></div>';
    html += '<div class="hint">Based on ' + res.windowCount + ' overlapping ' + res.horizon + '-year windows drawn from ' + res.years +
      ' years of estimated annual index levels. Overlapping windows share most of their data, so this is not ' + res.windowCount +
      ' independent trials — read it as one history sliced multiple ways. "Equity always wins over the long run" is largely a US-specific finding; other major markets, Japan among them, have gone 20+ years without a real peak recovering.</div>';

    html += '<div class="divider"></div><div class="section-label">Dialling equity up or down from your mix</div>';

    var pf = S.portfolio;
    var alloc = computeAllocation();
    var cur = topOption(TOP_MARKETS, S.top.market).currency;
    var tTotal = targetsTotal(pf.targets);
    var plan = rebalancePlan(alloc, pf.targets, Number(pf.band) || 5);
    var html = '';

    // ---- Targets ----
    html += '<div class="card"><h2>Target mix</h2>';
    html += '<div class="hint">The split across sleeves drives most of your return variability — more than which fund fills each one. These templates are conventional starting points, not prescriptions; edit them freely.</div>';
    html += '<div class="toggle-pill" style="margin-top:10px">' + HORIZONS.map(function (h) {
      return '<button data-action="pf-horizon" data-value="' + h.v + '" class="' + (pf.horizon === h.v ? 'active' : '') + '">' + escapeHTML(h.l) + '</button>';
    }).join('') + '</div>';
    html += '<div class="divider"></div>';
    html += ASSET_CLASSES.map(function (c) {
      return '<div class="field"><label>' + escapeHTML(c.l) + ' %</label><input ' + swpNumAttrs() +
        ' data-bind="portfolio.targets.' + c.v + '" value="' + escapeHTML(String(pf.targets[c.v])) + '"></div>';
    }).join('');
    if (Math.abs(tTotal - 100) > 0.01) {
      html += '<div class="err">Targets total ' + tTotal.toFixed(1) + '% — ' +
        (tTotal > 100 ? 'reduce by ' + (tTotal - 100).toFixed(1) : 'add ' + (100 - tTotal).toFixed(1)) + ' percentage points to reach 100%.</div>';
    }
    html += '<div class="row" style="margin-top:10px">' +
      '<div class="field"><label>Rebalance band (±pp)</label><input ' + swpNumAttrs() + ' data-bind="portfolio.band" value="' + escapeHTML(String(pf.band)) + '"></div>' +
      '<div class="field"><label>New money available</label><input ' + swpNumAttrs() + ' data-bind="portfolio.contribution" value="' + escapeHTML(String(pf.contribution)) + '"></div></div>';
    html += '</div>';

    // ---- Holdings ----
    html += '<div class="card"><h2>Holdings</h2>';
    html += '<div class="hint">Shared with the stock detail panel — anything entered there appears here. Assign each one a sleeve so the mix can be computed.</div>';
    if (!alloc.rows.length) {
      html += '<div class="empty">No holdings yet.<br>Add one below, or open a fund from the Funds tab and enter your lots there.</div>';
    } else {
      html += '<div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Holding</th><th>Sleeve</th><th>Units</th><th>Value</th><th>Weight</th><th></th></tr></thead><tbody>';
      html += alloc.rows.map(function (e) {
        var w = alloc.total > 0 && e.value != null ? e.value / alloc.total * 100 : null;
        return '<tr><td>' + escapeHTML(e.ticker) + '</td>' +
          '<td><select data-bind="holdings.' + escapeHTML(e.ticker) + '.assetClass">' + ASSET_CLASSES.map(function (c) {
            return '<option value="' + c.v + '"' + (e.assetClass === c.v ? ' selected' : '') + '>' + escapeHTML(c.l) + '</option>';
          }).join('') + '</select></td>' +
          '<td>' + e.units.toFixed(3) + '</td>' +
          '<td>' + (e.value == null ? '<span class="stale">no price</span>' : fmtCurrency(e.value, cur)) + '</td>' +
          '<td>' + (w == null ? '—' : w.toFixed(1) + '%') + '</td>' +
          '<td><button class="lot-del" data-action="pf-remove-holding" data-ticker="' + escapeHTML(e.ticker) + '">✕</button></td></tr>';
      }).join('');
      html += '</tbody></table></div>';
      html += '<div class="hint">Total ' + fmtCurrency(alloc.total, cur) +
        (alloc.unpriced.length ? ' · ' + alloc.unpriced.length + ' holding(s) excluded for want of a price — open them from Funds and set one.' : '') + '</div>';
    }
    html += '<div class="row" style="margin-top:10px">' +
      '<div class="field"><label>Add ticker</label><input type="text" id="pf-new-ticker" placeholder="e.g. NIFTYBEES" autocapitalize="characters"></div>' +
      '<div class="field"><label>&nbsp;</label><button class="secondary" data-action="pf-add-holding">Add holding</button></div></div>';
    html += '</div>';

    // Candidates and the buy plan come before the drift view on purpose: with no
    // holdings yet there is no drift to show, but that is exactly when someone
    // needs to know what to buy.
    html += renderSleeveCandidates(alloc, plan, cur);
    html += renderHorizonBacktest();

    if (!alloc.priced.length) return html;

    // ---- Drift ----
    html += '<div class="card"><h2>Drift</h2>';
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sleeve</th><th>Now</th><th>Target</th><th>Drift</th><th>Action</th></tr></thead><tbody>';
    html += plan.map(function (p) {
      return '<tr><td>' + escapeHTML(p.cls.l) + '</td><td>' + p.currentPct.toFixed(1) + '%</td><td>' + p.targetPct + '%</td>' +
        '<td class="' + (Math.abs(p.drift) > (Number(pf.band) || 5) ? 'neg' : '') + '">' + fmtPercent(p.drift).replace('%', 'pp') + '</td>' +
        '<td class="' + (p.amount >= 0 ? 'pos' : 'neg') + '">' + (Math.abs(p.amount) < 1 ? '—' : (p.amount > 0 ? 'add ' : 'trim ') + fmtCurrency(Math.abs(p.amount), cur)) + '</td></tr>';
    }).join('');
    html += '</tbody></table></div>';

    // ---- Contribution-first ----
    var cp = contributionPlan(plan, Number(pf.contribution) || 0);
    if (cp.need > 0.5) {
      html += '<div class="divider"></div><div class="section-label">Correcting it</div>';
      if (cp.contribution > 0) {
        html += '<div class="hint">Directing ' + fmtCurrency(cp.contribution, cur) + ' of new money at the underweight sleeves covers <strong>' +
          cp.covers.toFixed(0) + '%</strong> of the gap and realises <strong>no gain, so no tax</strong>:</div>';
        html += '<div class="stat-grid" style="margin-top:10px">' + ASSET_CLASSES.filter(function (c) { return cp.alloc[c.v] > 0.5; })
          .map(function (c) { return stat(c.l, fmtCurrency(cp.alloc[c.v], cur), 'pos'); }).join('') + '</div>';
        if (cp.unmet > 0.5) html += '<div class="hint">' + fmtCurrency(cp.unmet, cur) + ' of the shortfall would remain.</div>';
      } else {
        html += '<div class="hint">Enter an amount under “New money available” above to see how much of this gap contributions could close without selling.</div>';
      }

      // Tax cost of doing it by selling instead
      var sells = plan.filter(function (p) { return p.amount < -1; });
      if (sells.length) {
        var today = todayISO(), lines = [], totSt = 0, totLt = 0;
        sells.forEach(function (p) {
          (alloc.bySleeve[p.cls.v].holdings || []).forEach(function (e) {
            var share = p.currentValue > 0 ? e.value / p.currentValue : 0;
            var amt = Math.abs(p.amount) * share;
            if (amt < 1 || e.price == null) return;
            var r = sellFromLots(e.lots, amt, e.price, today, S.swp.rates);
            totSt += r.stGain; totLt += r.ltGain;
            lines.push(e.ticker + ': sell ' + fmtCurrency(r.proceeds, cur) + ', gain ' +
              fmtCurrency(r.stGain + r.ltGain, cur) + ' (' + fmtCurrency(r.stGain, cur) + ' short-term)');
          });
        });
        if (lines.length) {
          // One annual exemption across every sale, not one per holding — taxing each
          // position separately would shelter the allowance once per line.
          var totalTax = estimateEquityTax(totSt, totLt, S.swp.rates);
          html += '<div class="hint stale" style="margin-top:10px">Doing the same correction by <strong>selling</strong> would realise ' +
            fmtCurrency(totSt + totLt, cur) + ' of gains and cost about <strong>' + fmtCurrency(totalTax, cur) + '</strong> in tax today:<br>' +
            lines.map(escapeHTML).join('<br>') +
            '<br>Oldest lots first, with the annual exemption applied once across all of it, using the rate panel on the SWP tab. For an NRI, TDS comes off each redemption on top of this.</div>';
        }
      }
    }
    html += '</div>';

    // ---- Deeper analysis ----
    html += '<div class="card"><h2>Diversification &amp; history</h2>';
    html += '<div class="btn-row"><button class="primary" data-action="pf-analyse"' + (S.portfolioFetch.loading ? ' disabled' : '') + '>' +
      (S.portfolioFetch.loading ? '<span class="spinner"></span>Analysing…' : (S.portfolioResult ? 'Re-run analysis' : 'Analyse portfolio')) + '</button></div>';
    if (S.portfolioFetch.error) html += '<div class="err">' + escapeHTML(S.portfolioFetch.error) + '</div>';

    var res = S.portfolioResult;
    if (!res) {
      html += '<div class="hint">Fetches ten years of month-end prices for each holding plus the benchmark (' +
        alloc.priced.length + ' + 1 lookups) to measure whether your holdings actually diversify each other, and how the combination has behaved.</div></div>';
      return html;
    }

    var flags = buildPortfolioFlags(alloc, plan, res.matrix, res.tickers, pf.horizon);
    html += '<div style="margin-top:6px">' + flags.map(function (f) {
      return '<div class="flag"><span class="flag-dot ' + f.level + '"></span><div class="flag-body">' +
        '<div class="flag-title">' + escapeHTML(f.title) + '</div>' +
        '<div class="flag-detail">' + escapeHTML(f.detail) + '</div></div></div>';
    }).join('') + '</div>';

    if (res.tickers.length > 1) {
      html += '<div class="divider"></div><div class="section-label">Correlation between holdings</div>';
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th>' +
        res.tickers.map(function (t) { return '<th>' + escapeHTML(t) + '</th>'; }).join('') + '</tr></thead><tbody>';
      html += res.matrix.map(function (row, i) {
        return '<tr><td>' + escapeHTML(res.tickers[i]) + '</td>' + row.map(function (c, j) {
          if (i === j) return '<td class="heat" style="background:rgba(255,255,255,.05)">—</td>';
          if (c == null) return '<td class="heat">—</td>';
          var t = Math.max(0, Math.min(1, (c + 1) / 2));
          return '<td class="heat" style="background:hsla(' + Math.round((1 - t) * 140) + ',70%,45%,.32)">' + c.toFixed(2) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      html += '</tbody></table></div>';
      html += '<div class="hint">Actual holdings overlap needs portfolio composition data no browser-only app can reach. Correlation of monthly returns is the computable stand-in — above ' +
        PORTFOLIO_THRESHOLDS.correlation.toFixed(2) + ', two holdings are doing one job.</div>';
    }

    if (res.stats) {
      html += '<div class="divider"></div><div class="section-label">The combination, at current weights</div>';
      html += '<div class="stat-grid">';
      html += stat('CAGR', Number.isFinite(res.stats.cagr) ? fmtPercent(res.stats.cagr) : '—', res.stats.cagr >= 0 ? 'pos' : 'neg');
      html += stat('Volatility (ann.)', Number.isFinite(res.stats.volatility) ? res.stats.volatility.toFixed(1) + '%' : '—');
      html += stat('Deepest fall', res.drawdown ? fmtPercent(res.drawdown.maxDD) : '—', 'neg');
      html += stat('Recovered', res.drawdown ? (res.drawdown.recovered ? 'in ' + res.drawdown.recoveryMonths + ' mo' : 'not yet') : '—',
        res.drawdown && res.drawdown.recovered ? 'pos' : 'neg');
      if (res.rolling) {
        html += stat('Beat ' + res.benchmark + ' (3y)', res.rolling.beatRate.toFixed(0) + '%', res.rolling.beatRate >= 50 ? 'pos' : 'neg');
        html += stat('Worst 3y window', fmtPercent(res.rolling.worst.fund), 'neg');
      }
      html += '</div>';
      html += '<div class="hint">Fixed weights rebalanced monthly across ' + res.months + ' months of estimated month-end prices. The portfolio-level drawdown is the number that decides whether you could actually have held this — not each holding\'s.</div>';
    }
    html += '</div>';
    return html;
  }

  function renderHistoryTab() {
    if (S.scenarios.length === 0) return '<div class="empty">No saved scenarios yet.<br>Run a what-if and tap "Save Scenario" to keep it here.</div>';
    var html = '';
    S.scenarios.forEach(function (sc) {
      var b = sc.result.base;
      var cls = b.gainAbs >= 0 ? 'pos' : 'neg';
      html += '<div class="scenario-item" data-action="load-scenario" data-id="' + sc.id + '">';
      html += '<div class="top"><span class="ticker">' + escapeHTML(sc.draft.ticker) + '</span><span class="badge ' + cls + '">' + fmtPercent(b.gainPct) + '</span></div>';
      html += '<div class="meta">' + (sc.draft.mode === 'dca' ? 'DCA' : 'Lump sum') + ' · ' + escapeHTML(sc.draft.assetType) + ' · sold ' + fmtDate(sc.draft.sellDate) + '</div>';
      html += '<div class="meta">Invested ' + fmtCurrency(b.investedTotal, sc.draft.currency) + ' → ' + fmtCurrency(b.currentValue, sc.draft.currency) + '</div>';
      html += '<div class="actions"><button class="secondary danger" data-action="delete-scenario" data-id="' + sc.id + '">Delete</button></div>';
      html += '</div>';
    });
    return html;
  }

  function renderSettingsTab() {
    var s = S.settings;
    var provider = providerOf(s.provider);
    var html = '<div class="card">';
    html += '<h2>LLM Endpoint (price oracle)</h2>';
    html += '<div class="field"><label>Provider</label><select data-bind="settings.provider">' + PROVIDER_ORDER.map(function (key) {
      return '<option value="' + key + '"' + (s.provider === key ? ' selected' : '') + '>' + PROVIDERS[key].label + '</option>';
    }).join('') + '</select></div>';
    var urlPlaceholder = provider.defaultUrl || 'https://…';
    var keyPlaceholder = provider.style === 'anthropic' ? 'sk-ant-…' : provider.style === 'gemini' ? 'AIza…' : 'sk-…';
    html += '<div class="field"><label>URL</label><input type="text" data-bind="settings.url" value="' + escapeHTML(s.url) + '" placeholder="' + escapeHTML(urlPlaceholder) + '"></div>';
    var modelHint = provider.style === 'gemini'
      ? 'Gemini\'s API embeds the model directly in the URL path (<code>…/models/&lt;model&gt;:generateContent</code>) — just edit that segment to switch models.'
      : 'There\'s no separate Model field — append <code>?model=&lt;name&gt;</code> to the end of the URL. It\'s stripped off before the request is sent and placed in the request body where the API expects it.';
    html += '<div class="field"><label>API Key</label><input type="password" data-bind="settings.apiKey" value="' + escapeHTML(s.apiKey) + '" placeholder="' + keyPlaceholder + '"></div>';
    html += '<div class="hint">' + modelHint + '</div>';
    var authHint = provider.style === 'gemini' ? 'an <code>x-goog-api-key</code> header'
      : provider.style === 'anthropic' ? 'an <code>x-api-key</code> header (plus the browser-access header Anthropic requires for direct client-side calls)'
      : 'an <code>Authorization: Bearer</code> header';
    html += '<div class="hint">Requests go straight from your browser to the URL above with ' + authHint + ' — nothing passes through a server you don\'t control. Some providers block direct browser (CORS) requests entirely; if calls fail immediately with a network error, that\'s the provider\'s CORS policy, not a bug here, and there\'s no backend in this app to route around it. Choosing "Custom" targets any OpenAI-compatible <code>/chat/completions</code> endpoint (local servers, other gateways, etc.).</div>';
    if (provider.style === 'gemini') {
      html += '<div class="checkrow" style="margin-top:12px"><input type="checkbox" id="grounding-cb" data-bind="settings.grounding"' + (s.grounding ? ' checked' : '') + '><label for="grounding-cb">Enable Search Grounding (Gemini only)</label></div>';
      html += '<div class="hint">Lets Gemini consult live Google Search instead of only its training memory — useful for current prices, recent news, or a company\'s latest quarter. Responses become less reproducible day-to-day and calls may be slower. Grounded answers still aren\'t guaranteed accurate; treat them the same as any other model output here.</div>';
    }
    html += '<div class="btn-row"><button class="secondary" data-action="test-connection" ' + (S.loading ? 'disabled' : '') + '>Test Connection</button></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h2>Data</h2>';
    html += '<div class="hint">Looked-up prices are cached locally so re-running or reloading a scenario doesn\'t re-query the model. ' + Object.keys(S.priceCache).length + ' price points cached.</div>';
    html += '<div class="btn-row"><button class="secondary danger" data-action="clear-cache">Clear Price Cache</button></div>';
    var mfMatchCount = Object.keys(S.mfNameMatch).length, mfReturnCount = Object.keys(S.mfReturns).length;
    if (mfMatchCount || mfReturnCount) {
      html += '<div class="divider"></div>';
      html += '<div class="hint">Mutual Funds & Index Funds (India) real data, fetched live from mfapi.in: ' + mfMatchCount +
        ' fund/ETF names matched to a real scheme, ' + mfReturnCount + ' real returns cached. Shared by both categories — never expires automatically, cleared only on request.</div>';
      html += '<div class="btn-row"><button class="secondary danger" data-action="clear-mfdata">Clear Real Fund Data</button></div>';
    }
    html += '</div>';

    html += '<div class="card"><h2>About</h2><div class="hint">Everything here — settings, scenarios, cached prices — lives only in this browser\'s localStorage. There is no backend and no database. The LLM is used solely as a historical price lookup; all return, DCA, and gain/loss math is computed locally in JavaScript.</div></div>';
    return html;
  }

  /* ---------------------------------------------------------------------
   * Top-level render
   * ------------------------------------------------------------------- */
  var TABS = [
    { v: 'new', l: 'New', ic: '＋' },
    { v: 'top', l: 'Funds', ic: '★' },
    { v: 'port', l: 'Mix', ic: '◐' },
    { v: 'swp', l: 'SWP', ic: '₹' },
    { v: 'history', l: 'History', ic: '☰' },
    { v: 'settings', l: 'Settings', ic: '⚙' }
  ];

  function renderHeader() {
    var titles = { new: 'What-If', top: 'Funds', port: 'Portfolio', swp: 'SWP Planner', history: 'History', settings: 'Settings' };
    var marketPill = '<div class="toggle-pill toggle-pill-sm">' + TOP_MARKETS.map(function (m) {
      return '<button data-action="set-top-market" data-value="' + m.v + '" class="' + (S.top.market === m.v ? 'active' : '') + '">' + m.l + '</button>';
    }).join('') + '</div>';
    return '<header class="topbar"><div class="brand"><span class="dot"></span>Forecast · ' + titles[S.tab] + '</div>' + marketPill + '</header>';
  }

  function renderBottomNav() {
    return '<nav class="bottomnav">' + TABS.map(function (t) {
      return '<button class="nav-btn ' + (S.tab === t.v ? 'active' : '') + '" data-action="set-tab" data-value="' + t.v + '"><span class="ic">' + t.ic + '</span>' + t.l + '</button>';
    }).join('') + '</nav>';
  }

  function render() {
    var body = S.tab === 'new' ? renderNewTab()
      : S.tab === 'top' ? renderTopTab()
      : S.tab === 'port' ? renderPortfolioTab()
      : S.tab === 'swp' ? renderSwpTab()
      : S.tab === 'history' ? renderHistoryTab()
      : renderSettingsTab();
    // Re-rendering replaces innerHTML, which would drop focus mid-keystroke on the
    // live-recalculating SWP inputs — so carry focus and caret across the swap.
    var active = document.activeElement;
    var focusKey = active && active.dataset ? active.dataset.bind : null;
    var scrollTop = 0;
    var prevMain = document.querySelector('#app main');
    if (prevMain) scrollTop = prevMain.scrollTop;
    var selStart = null, selEnd = null;
    if (focusKey) { try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) { /* number/date inputs disallow selection */ } }

    document.getElementById('app').innerHTML =
      renderHeader() +
      '<main class="scroll">' + body + '</main>' +
      renderBottomNav();

    var newMain = document.querySelector('#app main');
    if (newMain && scrollTop) newMain.scrollTop = scrollTop;
    if (focusKey) {
      var el = document.querySelector('[data-bind="' + focusKey + '"]');
      if (el) {
        el.focus();
        if (selStart != null) { try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* ditto */ } }
      }
    }
  }

  /* ---------------------------------------------------------------------
   * Event delegation
   * ------------------------------------------------------------------- */
  function onClick(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'set-tab') { S.tab = el.dataset.value; render(); }
    else if (action === 'set-mode') { S.draft.mode = el.dataset.value; render(); }
    else if (action === 'run') { runScenario(); }
    else if (action === 'save-scenario') { saveScenario(); }
    else if (action === 'load-scenario') { loadScenario(el.dataset.id); }
    else if (action === 'delete-scenario') { e.stopPropagation(); if (confirm('Delete this saved scenario?')) deleteScenario(el.dataset.id); }
    else if (action === 'test-connection') { testConnection(); }
    else if (action === 'clear-cache') { if (confirm('Clear all cached prices?')) clearCache(); }
    else if (action === 'clear-mfdata') {
      if (confirm('Clear cached fund/ETF matches and real returns?')) {
        S.mfReturns = {}; S.mfNameMatch = {}; saveMfReturns(); saveMfNameMatch(); render();
        toast('success', 'Cleared cached real fund data.');
      }
    }
    else if (action === 'set-top-market') {
      S.top.market = el.dataset.value;
      // The market selector is global now (header), so What-If's currency label
      // should track it too, not just when arriving there via "Analyze".
      S.draft.currency = topOption(TOP_MARKETS, S.top.market).currency;
      saveTopPrefs(); render();
    }
    else if (action === 'set-top-category') { S.top.category = el.dataset.value; saveTopPrefs(); render(); }
    else if (action === 'set-top-period') { S.top.period = el.dataset.value; saveTopPrefs(); render(); }
    else if (action === 'fetch-top') { fetchTopList(); }
    else if (action === 'use-ticker') { useTicker(el.dataset.ticker); }
    else if (action === 'open-analysis') { openAnalysis(el.dataset.ticker, el.dataset.name); }
    else if (action === 'close-analysis') { closeAnalysis(); }
    else if (action === 'refresh-analysis') { fetchAnalysis(el.dataset.ticker); }
    else if (action === 'analysis-what-if') { useTicker(el.dataset.ticker); }
    else if (action === 'run-evidence') { runEvidence(el.dataset.ticker); }
    else if (action === 'pf-horizon') {
      var h = HORIZONS.filter(function (x) { return x.v === el.dataset.value; })[0];
      S.portfolio.horizon = el.dataset.value;
      if (h) S.portfolio.targets = Object.assign({}, h.targets);
      savePortfolio(); render();
    }
    else if (action === 'pf-analyse') { analysePortfolio(); }
    else if (action === 'pf-suggest') { fetchSleeveCandidates(); }
    else if (action === 'pf-toggle-proxies') { S.portfolio.btProxiesOpen = !S.portfolio.btProxiesOpen; savePortfolio(); render(); }
    else if (action === 'pf-backtest') { runHorizonBacktest(); }
    else if (action === 'pf-pick') {
      S.portfolio.picks[el.dataset.sleeve] = el.dataset.ticker;
      savePortfolio(); render();
    }
    else if (action === 'pf-analyse-candidate') { S.tab = 'top'; openAnalysis(el.dataset.ticker, ''); }
    else if (action === 'pf-add-candidate') {
      var ct = el.dataset.ticker;
      if (!S.holdings[ct]) S.holdings[ct] = { lots: [], priceOverride: '' };
      S.holdings[ct].assetClass = el.dataset.sleeve;
      // No lots invented — the user fills units and price once they have actually bought.
      if (!S.holdings[ct].lots.length) S.holdings[ct].lots.push({ id: uid(), units: '', price: '', date: todayISO() });
      saveHoldings(); render();
      toast('success', ct + ' added — enter units and price once you have bought.');
    }
    else if (action === 'pf-add-holding') {
      var inp = document.getElementById('pf-new-ticker');
      var tk = (inp && inp.value || '').trim().toUpperCase();
      if (!tk) { toast('error', 'Enter a ticker to add.'); return; }
      if (!S.holdings[tk]) S.holdings[tk] = { lots: [], priceOverride: '', assetClass: 'eq_in' };
      if (!S.holdings[tk].lots.length) S.holdings[tk].lots.push({ id: uid(), units: '', price: '', date: todayISO() });
      saveHoldings();
      openAnalysis(tk, '');
      toast('success', tk + ' added — enter its lots below.');
    }
    else if (action === 'pf-remove-holding') {
      if (confirm('Remove ' + el.dataset.ticker + ' from your holdings?')) {
        delete S.holdings[el.dataset.ticker];
        S.portfolioResult = null;
        saveHoldings(); render();
      }
    }
    else if (action === 'use-suggested-benchmark') {
      S.top.benchmark[el.dataset.market] = el.dataset.value;
      saveTopPrefs(); render();
    }
    else if (action === 'add-holding-lot') {
      var tk = el.dataset.ticker;
      if (!S.holdings[tk]) S.holdings[tk] = { lots: [], priceOverride: '' };
      S.holdings[tk].lots.push({ id: uid(), units: '', price: '', date: todayISO() });
      saveHoldings(); render();
    }
    else if (action === 'remove-holding-lot') {
      var rt = el.dataset.ticker;
      if (S.holdings[rt]) { S.holdings[rt].lots.splice(Number(el.dataset.index), 1); saveHoldings(); render(); }
    }
    else if (action === 'swp-toggle-section') { S.swp.openSections[el.dataset.key] = !S.swp.openSections[el.dataset.key]; saveSwp(); render(); }
    else if (action === 'swp-entry-mode') { S.swp.entryMode = el.dataset.value; saveSwp(); render(); }
    else if (action === 'swp-amount-mode') { S.swp.amountMode = el.dataset.value; saveSwp(); render(); }
    else if (action === 'swp-residency') { S.swp.residency = el.dataset.value; saveSwp(); render(); }
    else if (action === 'swp-add-lot') { S.swp.lots.push({ id: uid(), units: 1000, nav: 100, date: yearsAgoISO(1) }); saveSwp(); render(); }
    else if (action === 'swp-remove-lot') { S.swp.lots.splice(Number(el.dataset.index), 1); saveSwp(); render(); }
    else if (action === 'swp-toggle-ledger') { S.swp.ledgerExpanded = !S.swp.ledgerExpanded; saveSwp(); render(); }
    else if (action === 'swp-export-csv') { swpExportCsv(); }
    else if (action === 'swp-fetch-rates') { fetchSwpRates(); }
    else if (action === 'swp-apply-rates') { applySwpRates(); }
    else if (action === 'swp-discard-rates') { discardSwpRates(); }
    else if (action === 'swp-reset-rates') { if (confirm('Reset tax rates to the built-in defaults?')) resetSwpRates(); }
  }

  function onProviderChange(newProviderKey) {
    var oldProvider = providerOf(S.settings.provider);
    var newProvider = providerOf(newProviderKey);
    if (!S.settings.url || S.settings.url === oldProvider.defaultUrl) S.settings.url = newProvider.defaultUrl;
    S.settings.provider = newProviderKey;
    saveSettings();
    render();
  }

  function onFormChange(e) {
    var el = e.target.closest('[data-bind]');
    if (!el) return;
    var path = el.dataset.bind;
    var value;
    if (el.type === 'checkbox') value = el.checked;
    else if (el.type === 'number') value = el.value === '' ? 0 : Number(el.value);
    else value = el.value;

    if (path === 'settings.provider') { onProviderChange(value); return; }
    if (path.indexOf('settings.') === 0) { setPath(S, path, value); saveSettings(); return; }
    // SWP recalculates live on every input, per the spec. Raw strings are stored so
    // partial entry ("", "1.") types naturally; the engine coerces at every use.
    if (path.indexOf('top.benchmark.') === 0) { setPath(S, path, el.value); saveTopPrefs(); render(); return; }
    if (path.indexOf('portfolio.') === 0) { setPath(S, path, el.value); savePortfolio(); render(); return; }
    // Holdings recalculate live like the SWP inputs, and store raw strings for the
    // same reason — partial entry has to type naturally.
    if (path.indexOf('holdings.') === 0) {
      setPath(S, path, el.type === 'checkbox' ? el.checked : el.value);
      saveHoldings();
      if (!(el.type === 'date' && e.type === 'input')) render();
      return;
    }
    if (path.indexOf('swp.') === 0) {
      setPath(S, path, el.type === 'checkbox' ? el.checked : el.value);
      saveSwp();
      // Date inputs are segmented — re-rendering per keystroke fights the picker,
      // so those settle on 'change' instead.
      if (!(el.type === 'date' && e.type === 'input')) render();
      return;
    }
    setPath(S.draft, path, value);

    var structural = path === 'assetType' || path === 'benchmark.enabled';
    if (structural) render();
  }

  /* ---------------------------------------------------------------------
   * Init
   * ------------------------------------------------------------------- */
  function init() {
    loadState();
    document.getElementById('app').addEventListener('click', onClick);
    document.getElementById('app').addEventListener('input', onFormChange);
    document.getElementById('app').addEventListener('change', onFormChange);
    render();
  }

  init();
})();
</script>
</body>
</html>
