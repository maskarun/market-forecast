      slices: slices, units: units, gross: actualGross, cost: cost,
      stGain: stGain, ltGain: ltGain, exemptionUsed: exemptionUsed,
      exitLoad: exitLoad, liability: tax, tds: isNri ? tax : 0,
      net: actualGross - exitLoad - (isNri ? tax : 0), isNri: isNri,
      short: remaining > 1e-9
    };
  }

  // net(gross) is monotonic increasing, so plain bisection is safe.
  function solveGrossForNet(targetNet, lots, nav, date, cfg, exemptionLeft, fyGains) {
    var netOf = function (g) {
      return simulateRedemption(g, lots, nav, date, cfg, exemptionLeft, fyGains).net;
    };
    var lo = 0, hi = Math.max(targetNet, 1) * 1.5;
    for (var k = 0; k < 40 && netOf(hi) < targetNet; k++) hi *= 1.5;
    for (var i = 0; i < 32; i++) {
      var mid = (lo + hi) / 2;
      if (netOf(mid) < targetNet) lo = mid; else hi = mid;
    }
    return hi;
  }

  function runSwp(cfg, annualReturn, opts) {
    opts = opts || {};
    var freq = swpFreq(cfg);
    var lots = swpLots(cfg).map(function (l) { return { units: l.units, nav: l.nav, date: l.date }; });
    var periods = Math.max(1, Math.round((Number(cfg.horizonYears) || 0) * freq.perYear));
    var amount = opts.amount != null ? opts.amount : (Number(cfg.amount) || 0);
    var mode = opts.mode || cfg.amountMode;
    var nav = Number(cfg.currentNav) || 0;
    var escal = (Number(cfg.escalation) || 0) / 100;
    var ledger = [], depletion = null, depletionIndex = null;
    var fy = null, exemptionLeft = 0, fyGains = 0;

    for (var i = 0; i < periods; i++) {
      var date = i === 0 ? cfg.startDate : addMonths(cfg.startDate, i * freq.months);
      if (i > 0) nav *= Math.pow(1 + (opts.sampler ? opts.sampler(i) : annualReturn) / 100, 1 / freq.perYear);

      var unitsLeft = lots.reduce(function (s, l) { return s + l.units; }, 0);
      if (unitsLeft <= 1e-9) { depletion = depletion || date; depletionIndex = depletionIndex == null ? i : depletionIndex; break; }

      var thisFy = finYearOf(date);
      if (thisFy !== fy) { fy = thisFy; exemptionLeft = Number(cfg.rates.ltcgExemption) || 0; fyGains = 0; }

      var target = amount * Math.pow(1 + escal, Math.floor(i / freq.perYear));
      var gross = mode === 'net'
        ? solveGrossForNet(target, lots, nav, date, cfg, exemptionLeft, fyGains)
        : target;
      var r = simulateRedemption(gross, lots, nav, date, cfg, exemptionLeft, fyGains);

      // Apply the redemption to the real lots.
      r.slices.forEach(function (s) { lots[s.lot].units -= s.units; });
      exemptionLeft -= r.exemptionUsed;
      fyGains += Math.max(0, r.stGain) + Math.max(0, r.ltGain - r.exemptionUsed);

      var remainingUnits = lots.reduce(function (s, l) { return s + l.units; }, 0);
      ledger.push({
        i: i, date: date, fy: thisFy, nav: nav, gross: r.gross, units: r.units,
        cost: r.cost, stGain: r.stGain, ltGain: r.ltGain, exemptionUsed: r.exemptionUsed,
        exitLoad: r.exitLoad, tds: r.tds, liability: r.liability, net: r.net,
        isNri: r.isNri, remainingUnits: remainingUnits, remainingValue: remainingUnits * nav
      });

      if (remainingUnits <= 1e-9) { depletion = date; depletionIndex = i; break; }
    }

    var last = ledger[ledger.length - 1];
    return {
      ledger: ledger,
      depletion: depletion,
      yearsToDepletion: depletionIndex == null ? null : (depletionIndex + 1) / freq.perYear,
      endingValue: last ? last.remainingValue : swpCorpusValue(cfg),
      survives: depletion == null
    };
  }

  function swpAnnualSummary(ledger) {
    var byFy = {};
    ledger.forEach(function (row) {
      var e = byFy[row.fy] || (byFy[row.fy] = {
        fy: row.fy, gross: 0, stGain: 0, ltGain: 0, exemptionUsed: 0,
        exitLoad: 0, tds: 0, liability: 0, net: 0
      });
      e.gross += row.gross; e.stGain += row.stGain; e.ltGain += row.ltGain;
      e.exemptionUsed += row.exemptionUsed; e.exitLoad += row.exitLoad;
      e.tds += row.tds; e.liability += row.liability; e.net += row.net;
    });
    return Object.keys(byFy).sort(function (a, b) { return a - b; }).map(function (k) {
      var e = byFy[k];
      e.refund = e.tds - e.liability; // positive ⇒ over-deducted ⇒ refund due
      return e;
    });
  }

  // Largest withdrawal that still leaves the corpus intact at the horizon.
  function swpMaxSustainable(cfg, annualReturn) {
    var corpus = swpCorpusValue(cfg);
    if (corpus <= 0) return 0;
    var lo = 0, hi = corpus / Math.max(1, swpFreq(cfg).perYear);
    for (var i = 0; i < 28; i++) {
      var mid = (lo + hi) / 2;
      if (runSwp(cfg, annualReturn, { amount: mid }).survives) lo = mid; else hi = mid;
    }
    return lo;
  }

  function gaussian() {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  // Returns are drawn per period, not once per path: sequence-of-returns risk is
  // the whole reason this number is interesting for a withdrawal plan.
  function swpMonteCarlo(cfg, paths) {
    paths = paths || 500;
    var mean = Number(cfg.returns.base) || 0, sd = Number(cfg.volatility.stdev) || 0;
    var survived = 0;
    for (var p = 0; p < paths; p++) {
      if (runSwp(cfg, mean, { sampler: function () { return mean + sd * gaussian(); } }).survives) survived++;
    }
    return survived / paths * 100;
  }

  var SWP_SENS_W = [3, 4, 5, 6, 7, 8];
  var SWP_SENS_R = [4, 6, 8, 10, 12, 14];
  // Gross mode deliberately: the rows *are* a gross withdrawal rate, and nesting the
  // net solver inside 36 cells × N periods would stall live recalculation.
  function swpSensitivity(cfg) {
    var corpus = swpCorpusValue(cfg), perYear = swpFreq(cfg).perYear;
    return SWP_SENS_W.map(function (w) {
      return SWP_SENS_R.map(function (r) {
        var out = runSwp(cfg, r, { amount: corpus * (w / 100) / perYear, mode: 'gross' });
        return out.survives ? null : out.yearsToDepletion;
      });
    });
  }

  /* ---------------------------------------------------------------------
   * Model-suggested tax rates. The model is a fallible recall source, not an
   * authority, so: bounds-check everything, never write straight into the
   * panel, and keep the provenance attached to whatever gets applied.
   * ------------------------------------------------------------------- */
  var RATE_BOUNDS = {
    eqStcg: [0, 100], eqLtcg: [0, 100], debtSlab: [0, 100], cess: [0, 100],
    ltcgExemption: [0, 1e8], eqHoldMonths: [1, 120], otherHoldMonths: [1, 120]
  };
  var RATE_LABELS = {
    eqStcg: 'Equity STCG %', eqLtcg: 'Equity LTCG %', ltcgExemption: 'LTCG annual exemption',
    debtSlab: 'Debt / slab %', cess: 'Cess %', eqHoldMonths: 'Equity holding (months)',
    otherHoldMonths: 'Other-asset holding (months)', surcharge: 'NRI surcharge slabs'
  };

  // Returns null if any scalar is missing or out of range — one bad field rejects the
  // whole response rather than letting e.g. eqLtcg:1250 quietly wreck every figure.
  function sanitizeRates(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var out = {}, ok = true;
    Object.keys(RATE_BOUNDS).forEach(function (k) {
      var v = Number(raw[k]);
      if (!Number.isFinite(v) || v < RATE_BOUNDS[k][0] || v > RATE_BOUNDS[k][1]) ok = false;
      else out[k] = v;
    });
    if (!ok) return null;
    out.surcharge = (Array.isArray(raw.surcharge) ? raw.surcharge : [])
      .map(function (s) { return { over: Number(s && s.over), pct: Number(s && s.pct) }; })
      .filter(function (s) {
        return Number.isFinite(s.over) && s.over >= 0 && Number.isFinite(s.pct) && s.pct >= 0 && s.pct <= 100;
      })
      .sort(function (a, b) { return a.over - b.over; });
    return out;
  }

  function surchargeSummary(slabs) {
    if (!slabs || !slabs.length) return 'none';
    return slabs.map(function (s) { return s.pct + '% over ' + fmtINR(s.over); }).join(', ');
  }
  function rateDisplay(key, value) {
    if (key === 'surcharge') return surchargeSummary(value);
    if (key === 'ltcgExemption') return fmtINR(value);
    return String(value);
  }
  function rateDiff(current, next) {
    return Object.keys(RATE_LABELS).filter(function (k) {
      return rateDisplay(k, current[k]) !== rateDisplay(k, next[k]);
    }).map(function (k) {
      return { key: k, label: RATE_LABELS[k], from: rateDisplay(k, current[k]), to: rateDisplay(k, next[k]) };
    });
  }

  function currentModelLabel() {
    var p = providerOf(S.settings.provider);
    var m = p.style === 'gemini'
      ? (String(S.settings.url || '').match(/models\/([^:]+)/) || [])[1]
      : extractModelFromUrl(S.settings.url || '').model;
    return p.label + (m ? ' · ' + m : '');
  }

  function fetchSwpRates() {
    S.swpRateFetch.loading = true; render();
    llmChatRequest(RATES_SYSTEM_PROMPT, JSON.stringify({
      jurisdiction: 'India', taxpayer: 'non-resident individual (NRI)', asset: 'mutual fund units'
    })).then(function (content) {
      var parsed = extractJSON(content);
      if (!parsed) throw new Error('Could not parse a rate table from the model response.');
      var clean = sanitizeRates(parsed.rates);
      if (!clean) throw new Error('The model returned rates that failed a sanity check (a value was missing or out of range), so nothing was changed.');
      S.swpRateFetch.preview = {
        rates: clean,
        basis: String(parsed.basis == null ? '' : parsed.basis).slice(0, 200),
        note: String(parsed.note == null ? '' : parsed.note).slice(0, 300),
        model: currentModelLabel()
      };
      toast('success', 'Rates received — review the changes before applying.');
    }).catch(function (err) {
      toast('error', err.message || 'Could not get rates from the model.');
    }).then(function () { S.swpRateFetch.loading = false; render(); });
  }

  function applySwpRates() {
    var p = S.swpRateFetch.preview;
    if (!p) return;
    S.swp.rates = Object.assign({}, S.swp.rates, p.rates);
    S.swp.ratesMeta = {
      source: 'model', fetchedAt: new Date().toISOString(),
      basis: p.basis, note: p.note, model: p.model
    };
    S.swpRateFetch.preview = null;
    saveSwp(); render();
    toast('success', 'Applied. Still worth checking against the current Finance Act.');
  }
  function discardSwpRates() { S.swpRateFetch.preview = null; render(); }
  function resetSwpRates() {
    S.swp.rates = defaultRates();
    S.swp.ratesMeta = { source: 'default', fetchedAt: '', basis: '', note: '', model: '' };
    S.swpRateFetch.preview = null;
    saveSwp(); render();
    toast('success', 'Reset to built-in defaults.');
  }

  function validateSwp(cfg) {
    var errs = {};
    if (cfg.entryMode === 'lump') {
      if (!(Number(cfg.lump.amount) > 0)) errs['lump.amount'] = 'Enter an amount greater than 0.';
      if (!(Number(cfg.lump.nav) > 0)) errs['lump.nav'] = 'Purchase NAV must be greater than 0.';
      if (!cfg.lump.date) errs['lump.date'] = 'Pick a purchase date.';
    } else if (!swpLots(cfg).length) {
      errs.lots = 'Add at least one lot with units, NAV and date all greater than 0.';
    }
    if (!(Number(cfg.currentNav) > 0)) errs.currentNav = 'Current NAV must be greater than 0.';
    if (!(Number(cfg.amount) > 0)) errs.amount = 'Withdrawal amount must be greater than 0.';
    if (!(Number(cfg.horizonYears) > 0)) errs.horizonYears = 'Horizon must be at least 1 year.';
    if (Number(cfg.horizonYears) > 60) errs.horizonYears = 'Horizon above 60 years is not meaningful — lower it.';
    if (!cfg.startDate) errs.startDate = 'Pick a start date.';
    if (Number(cfg.escalation) < 0) errs.escalation = 'Escalation cannot be negative.';
    if (Number(cfg.exitLoad.pct) < 0) errs['exitLoad.pct'] = 'Exit load cannot be negative.';
    if (Number(cfg.exitLoad.days) < 0) errs['exitLoad.days'] = 'Exit load period cannot be negative.';
    if (cfg.transitionEnabled && !cfg.transitionDate) errs.transitionDate = 'Pick a transition date or turn the toggle off.';
    if (cfg.volatility.enabled && !(Number(cfg.volatility.stdev) > 0)) errs['volatility.stdev'] = 'Volatility must be greater than 0.';
    ['eqStcg', 'eqLtcg', 'debtSlab', 'cess', 'ltcgExemption'].forEach(function (k) {
      if (Number(cfg.rates[k]) < 0) errs['rates.' + k] = 'Cannot be negative.';
    });
    ['eqHoldMonths', 'otherHoldMonths'].forEach(function (k) {
      if (!(Number(cfg.rates[k]) > 0)) errs['rates.' + k] = 'Holding period must be greater than 0.';
    });
    return errs;
  }

  /* ---------------------------------------------------------------------
   * Toasts
   * ------------------------------------------------------------------- */
  function toast(type, message) {
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    var container = document.getElementById('toast-container');
    container.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }

  /* ---------------------------------------------------------------------
   * Chart rendering (inline SVG, no libraries)
   * ------------------------------------------------------------------- */
  function renderChartSVG(series, currency) {
    var W = 600, H = 220, pad = 28;
    var pts = series.filter(function (p) { return p.value != null; });
    if (pts.length < 2) return '<div class="empty">Not enough price points to draw a chart.</div>';
    var vals = [];
    series.forEach(function (p) { if (p.value != null) vals.push(p.value); if (p.benchValue != null) vals.push(p.benchValue); });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max) { min *= 0.95; max *= 1.05; }
    var n = series.length;
    function xAt(i) { return pad + (i / Math.max(1, n - 1)) * (W - 2 * pad); }
    function yAt(v) { return H - pad - ((v - min) / (max - min)) * (H - 2 * pad); }

    function pathFor(field) {
      var d = '', started = false;
      series.forEach(function (p, i) {
        var v = p[field];
        if (v == null) { started = false; return; }
        var cmd = started ? 'L' : 'M';
        d += cmd + xAt(i).toFixed(1) + ',' + yAt(v).toFixed(1) + ' ';
        started = true;
      });
      return d.trim();
    }

    var mainPath = pathFor('value');
    var benchPath = series.some(function (p) { return p.benchValue != null; }) ? pathFor('benchValue') : null;

    var first = series[0].date, last = series[series.length - 1].date;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    svg += '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="#2a3350" stroke-width="1"/>';
    if (benchPath) svg += '<path d="' + benchPath + '" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4"/>';
    svg += '<path d="' + mainPath + '" fill="none" stroke="#818cf8" stroke-width="2.5"/>';
    svg += '<text x="' + pad + '" y="' + (H - 8) + '" font-size="10" fill="#8b93ab">' + escapeHTML(fmtDate(first)) + '</text>';
    svg += '<text x="' + (W - pad) + '" y="' + (H - 8) + '" font-size="10" fill="#8b93ab" text-anchor="end">' + escapeHTML(fmtDate(last)) + '</text>';
    svg += '<text x="' + pad + '" y="14" font-size="10" fill="#8b93ab">' + escapeHTML(fmtCurrency(max, currency)) + '</text>';
    svg += '<text x="' + pad + '" y="' + (H - pad - 4) + '" font-size="10" fill="#8b93ab">' + escapeHTML(fmtCurrency(min, currency)) + '</text>';
    svg += '</svg>';
    return svg;
  }

  /* ---------------------------------------------------------------------
   * Render: form pieces
   * ------------------------------------------------------------------- */
  var ASSET_TYPES = [
    { v: 'stock', l: 'Stock' }, { v: 'bond', l: 'Bond' },
    { v: 'etf', l: 'ETF' }, { v: 'index', l: 'Index Fund' }
  ];
  var FREQS = [
    { v: 'weekly', l: 'Weekly' }, { v: 'monthly', l: 'Monthly' }, { v: 'quarterly', l: 'Quarterly' }
  ];

  function renderNewTab() {
    var d = S.draft;
    var html = '';

    html += '<div class="card">';
    html += '<h2>Security</h2>';
    html += '<div class="row">';
    html += '<div class="field"><label>Ticker</label><input type="text" data-bind="ticker" value="' + escapeHTML(d.ticker) + '" placeholder="AAPL" autocapitalize="characters"></div>';
    html += '<div class="field"><label>Asset Type</label><select data-bind="assetType">' + ASSET_TYPES.map(function (t) {
      return '<option value="' + t.v + '"' + (d.assetType === t.v ? ' selected' : '') + '>' + t.l + '</option>';
    }).join('') + '</select></div>';
    html += '</div>';
    html += '<div class="field"><label>Currency (label only — no conversion is performed)</label><input type="text" data-bind="currency" value="' + escapeHTML(d.currency) + '" placeholder="USD"></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h2>Purchase</h2>';
    html += '<div class="toggle-pill" data-role="mode-pill">';
    html += '<button data-action="set-mode" data-value="lumpsum" class="' + (d.mode === 'lumpsum' ? 'active' : '') + '">Lump Sum</button>';
    html += '<button data-action="set-mode" data-value="dca" class="' + (d.mode === 'dca' ? 'active' : '') + '">Recurring (DCA)</button>';
    html += '</div>';
    html += '<div class="divider"></div>';

    if (d.mode === 'lumpsum') {
      html += '<div class="row">';
      html += '<div class="field"><label>Amount</label><input type="number" min="0" step="0.01" data-bind="lumpsum.amount" value="' + d.lumpsum.amount + '"></div>';
      html += '<div class="field"><label>Buy Date</label><input type="date" data-bind="lumpsum.buyDate" value="' + d.lumpsum.buyDate + '" max="' + todayISO() + '"></div>';
      html += '</div>';
    } else {
      html += '<div class="row">';
      html += '<div class="field"><label>Amount per contribution</label><input type="number" min="0" step="0.01" data-bind="dca.amount" value="' + d.dca.amount + '"></div>';
      html += '<div class="field"><label>Frequency</label><select data-bind="dca.frequency">' + FREQS.map(function (f) {
        return '<option value="' + f.v + '"' + (d.dca.frequency === f.v ? ' selected' : '') + '>' + f.l + '</option>';
      }).join('') + '</select></div>';
      html += '</div>';
      html += '<div class="row">';
      html += '<div class="field"><label>Start Date</label><input type="date" data-bind="dca.startDate" value="' + d.dca.startDate + '" max="' + todayISO() + '"></div>';
      html += '<div class="field"><label>End Date</label><input type="date" data-bind="dca.endDate" value="' + d.dca.endDate + '" max="' + todayISO() + '"></div>';
      html += '</div>';
      html += '<div class="hint">' + contributionDates(d).length + ' contributions scheduled.</div>';
    }

    html += '<div class="field" style="margin-top:12px"><label>Sell / Value Date</label><input type="date" data-bind="sellDate" value="' + d.sellDate + '" max="' + todayISO() + '"></div>';
    html += '<div class="hint">Defaults to today; set an earlier date to see what selling on a specific day would have looked like.</div>';
    html += '</div>';

    if (d.assetType === 'bond') {
      html += '<div class="card">';
      html += '<h2>Bond Details</h2>';
      html += '<div class="row">';
      html += '<div class="field"><label>Annual Coupon Rate (%)</label><input type="number" min="0" step="0.01" data-bind="bond.couponRate" value="' + d.bond.couponRate + '"></div>';
      html += '<div class="field"><label>Face Value</label><input type="number" min="0" step="0.01" data-bind="bond.faceValue" value="' + d.bond.faceValue + '"></div>';
      html += '</div>';
      html += '<div class="hint">Coupon income is estimated as a simple (non-compounding) accrual: face value × coupon rate × years held, shown alongside price return.</div>';
      html += '</div>';
    }

    html += '<div class="card">';
    html += '<h2>Benchmark</h2>';
    html += '<div class="checkrow"><input type="checkbox" id="bench-cb" data-bind="benchmark.enabled"' + (d.benchmark.enabled ? ' checked' : '') + '><label for="bench-cb">Compare against a benchmark ticker</label></div>';
    if (d.benchmark.enabled) {
      html += '<div class="field" style="margin-top:10px"><label>Benchmark Ticker</label><input type="text" data-bind="benchmark.ticker" value="' + escapeHTML(d.benchmark.ticker) + '" placeholder="SPY"></div>';
    }
    html += '</div>';

    html += '<button class="primary" data-action="run" ' + (S.loading ? 'disabled' : '') + '>' + (S.loading ? '<span class="spinner"></span>Looking up prices…' : 'Run What-If') + '</button>';

    if (S.activeResult) html += renderResult();

    return html;
  }

  function renderResult() {
    var d = S.draft, r = S.activeResult, b = r.base;
    var gainClass = b.gainAbs >= 0 ? 'pos' : 'neg';
    var html = '<div class="card">';
    html += '<h2>Result</h2>';
    html += '<div class="stat-grid">';
    html += stat('Invested', fmtCurrency(b.investedTotal, d.currency));
    html += stat('Current Value', fmtCurrency(b.currentValue, d.currency));
    html += stat('Gain / Loss', fmtCurrency(b.gainAbs, d.currency), gainClass);
    html += stat('Return', fmtPercent(b.gainPct), gainClass);
    if (d.mode === 'dca') {
      html += stat('Avg Cost / Share', fmtCurrency(b.avgCost, d.currency));
      html += stat('Contributions', String(b.contributions.length));
    } else {
      html += stat('Buy Price', fmtCurrency(b.avgCost, d.currency));
      html += stat('Sell Price', fmtCurrency(b.sellPrice, d.currency));
    }
    html += '</div>';

    if (r.bond) {
      html += '<div class="divider"></div>';
      html += '<div class="section-label">Bond Income</div>';
      html += '<div class="stat-grid">';
      html += stat('Coupon Income (est.)', fmtCurrency(r.bond.couponIncome, d.currency));
      html += stat('Holding Period', r.bond.years.toFixed(2) + ' yrs');
      html += stat('Total Return (price + coupon)', fmtCurrency(r.bond.totalReturnAbs, d.currency), r.bond.totalReturnAbs >= 0 ? 'pos' : 'neg');
      html += stat('Total Return %', fmtPercent(r.bond.totalReturnPct), r.bond.totalReturnPct >= 0 ? 'pos' : 'neg');
      html += '</div>';
    }

    html += '<div class="divider"></div>';
    html += '<div class="chart-wrap">' + renderChartSVG(r.chartSeries, d.currency) + '</div>';
    if (r.benchBase) {
      html += '<div class="legend"><span><i></i>' + escapeHTML(d.ticker) + '</span><span><i class="bench"></i>' + escapeHTML(d.benchmark.ticker) + '</span></div>';
      html += '<div class="divider"></div>';
      html += '<div class="section-label">vs. ' + escapeHTML(d.benchmark.ticker) + '</div>';
      html += '<div class="stat-grid">';
      html += stat(d.benchmark.ticker + ' Return', fmtPercent(r.benchBase.gainPct), r.benchBase.gainPct >= 0 ? 'pos' : 'neg');
      var diff = b.gainPct - r.benchBase.gainPct;
      html += stat(diff >= 0 ? 'Outperformed by' : 'Underperformed by', fmtPercent(Math.abs(diff)).replace('+', ''), diff >= 0 ? 'pos' : 'neg');
      html += '</div>';
    }

    html += '<div class="btn-row"><button class="secondary" data-action="save-scenario">Save Scenario</button></div>';
    html += '</div>';
    return html;
  }

  function stat(label, value, cls) {
    return '<div class="stat"><div class="label">' + escapeHTML(label) + '</div><div class="value' + (cls ? ' ' + cls : '') + '">' + value + '</div></div>';
  }

  var TOP_CATEGORIES = [
    { v: 'stocks', l: 'Stocks' }, { v: 'index', l: 'Index Funds' }, { v: 'mutual', l: 'Mutual Funds' },
    // Indian income-tax classifications, so only meaningful for the India market.
    { v: 'swpcats', l: 'By tax category', indiaOnly: true }
  ];
  function topCategoriesFor(market) {
    return TOP_CATEGORIES.filter(function (c) { return !c.indiaOnly || market === 'in'; });
  }
  // One-line plain-English tax treatment, read from the rates actually in effect.
  function swpTaxNote(cat) {
    var r = S.swp.rates;
    if (cat.tax === 'slab_always') return 'taxed at slab rate however long it is held';
    var months = cat.hold === 'eq' ? Number(r.eqHoldMonths) : Number(r.otherHoldMonths);
    return 'taxed as ' + (cat.tax === 'equity' ? 'equity' : 'debt') + ' · long-term after ' + months + ' months';
  }
  var TOP_MARKETS = [
    { v: 'in', l: 'India', prompt: 'India (securities listed on the NSE or BSE)', currency: 'INR' },
    { v: 'us', l: 'US', prompt: 'the United States (securities listed on the NYSE or NASDAQ)', currency: 'USD' }
  ];
  var TOP_PERIODS = [
    { v: '6m', l: '6 Months', prompt: 'the last 6 months', label: '6-month' },
    { v: '1y', l: '1 Year', prompt: 'the last 1 year', label: '1-year' },
    { v: '5y', l: '5 Years', prompt: 'the last 5 years', label: '5-year' }
  ];
  function topOption(list, value) { return list.filter(function (o) { return o.v === value; })[0] || list[0]; }

  // Shared by the flat top-10 list and the per-category groups; the caller supplies
  // the row's action attributes since the two views tap through to different tabs.
  function rankRow(it, i, actionAttrs) {
    var pctCls = Number.isFinite(it.returnPct) ? (it.returnPct >= 0 ? 'pos' : 'neg') : '';
    var head = it.ticker || it.name;
    var sub = it.ticker && it.name ? it.name : '';
    return '<div class="rank-item" ' + actionAttrs + '>' +
      '<div class="rank-num">' + (i + 1) + '</div>' +
      '<div class="rank-body"><div class="rank-ticker">' + escapeHTML(head) + '</div>' +
      (sub ? '<div class="rank-name">' + escapeHTML(sub) + '</div>' : '') + '</div>' +
      '<div class="rank-ret ' + pctCls + '">' + (Number.isFinite(it.returnPct) ? fmtPercent(it.returnPct) : '—') + '</div>' +
      '</div>';
  }

  function renderTopGroups(t, entry) {
    var present = {};
    entry.groups.forEach(function (g) { present[g.category] = g.items; });
    var missing = SWP_CATEGORIES.filter(function (c) { return !present[c.v]; });

    var html = '<div class="card">';
    html += '<h2>Top 5 per tax category · India · ' + topOption(TOP_PERIODS, t.period).label + '</h2>';
    // Rendered in SWP_CATEGORIES order, not whatever order the model replied in.
    SWP_CATEGORIES.forEach(function (cat) {
      var items = present[cat.v];
      if (!items) return;
      html += '<div class="section-label" style="margin-top:14px">' + escapeHTML(cat.l) + '</div>';
      html += '<div class="hint" style="margin:-6px 0 8px">' + escapeHTML(swpTaxNote(cat)) + '</div>';
      html += items.map(function (it, i) {
        return rankRow(it, i, 'data-action="use-swp-category" data-category="' + escapeHTML(cat.v) + '"');
      }).join('');
    });
    if (missing.length) {
      html += '<div class="hint stale" style="margin-top:12px">The model returned nothing for: ' +
        escapeHTML(missing.map(function (c) { return c.l; }).join(', ')) + '. Refresh to try again.</div>';
    }
    html += '<div class="hint">Tap any fund to open the SWP planner with that tax category selected. Fetched ' +
      escapeHTML(new Date(entry.fetchedAt).toLocaleString()) + '.</div>';
    html += '</div>';
    return html;
  }

  function pctStat(label, v) {
    return stat(label, Number.isFinite(v) ? fmtPercent(v) : '—', Number.isFinite(v) ? (v >= 0 ? 'pos' : 'neg') : '');
  }

  function renderDetailStats(stats, cur) {
    if (!stats) {
      return '<div class="hint">No price data yet for the computed stats.' +
        (S.detailFetch.priceError ? ' ' + escapeHTML(S.detailFetch.priceError) : '') + '</div>';
    }
    var html = '<div class="stat-grid">';
    html += pctStat('6-month return', stats.ret6m);
    html += pctStat('1-year return', stats.ret1y);
    html += pctStat('5-year return', stats.ret5y);
    html += pctStat('CAGR', stats.cagr);
    html += pctStat('Max drawdown', stats.maxDrawdown);
    html += stat('Volatility (ann.)', Number.isFinite(stats.volatility) ? stats.volatility.toFixed(1) + '%' : '—');
    html += stat('Last close', fmtCurrency(stats.last.price, cur));
    html += stat('vs ' + stats.smaMonths + '-month avg', fmtPercent(stats.vsSma10), stats.vsSma10 >= 0 ? 'pos' : 'neg');
    html += '</div>';
    html += '<div class="hint">Computed here in JavaScript from ' + stats.points.length +
      ' estimated month-end prices — not exchange data. The ' + stats.smaMonths +
      '-month average is the monthly stand-in for a 200-day average; this granularity does not support RSI or MACD honestly.</div>';
    return html;
  }

  function renderEvidence(ticker, market) {
    var a = S.analysis[ticker] || {};
    var ev = a.evidence, fund = a.fund;
    var bench = activeBenchmark(market);
    var html = '<div class="card"><h2>Evidence</h2>';

    html += '<div class="field"><label>Benchmark to measure against</label>' +
      '<input ' + swpNumAttrs() + ' data-bind="top.benchmark.' + market + '" value="' +
      escapeHTML(String((S.top.benchmark && S.top.benchmark[market]) || '')) + '" placeholder="' + escapeHTML(defaultBenchmark(market)) + '"></div>';
    if (fund && fund.benchmarkName && fund.benchmarkName.toLowerCase() !== bench.toLowerCase()) {
      html += '<div class="hint">The model says this scheme is benchmarked to <strong>' + escapeHTML(fund.benchmarkName) +
        '</strong>. <button class="hbtn" data-action="use-suggested-benchmark" data-market="' + market +
        '" data-value="' + escapeHTML(fund.benchmarkName) + '">Use it</button></div>';
    }
    html += '<div class="btn-row"><button class="primary" data-action="run-evidence" data-ticker="' + escapeHTML(ticker) + '"' +
      (S.detailFetch.evidenceLoading ? ' disabled' : '') + '>' +
      (S.detailFetch.evidenceLoading ? '<span class="spinner"></span>Comparing 10 years…'
        : (ev ? 'Re-run against ' + escapeHTML(bench) : 'Run evidence analysis')) + '</button></div>';

    if (!ev) {
      if (S.detailFetch.evidenceError) html += '<div class="err">' + escapeHTML(S.detailFetch.evidenceError) + '</div>';
      html += '<div class="hint">Fetches ten years of month-end prices for ' + escapeHTML(ticker) + ' and ' + escapeHTML(bench) +
        ' (two lookups) and compares every overlapping window, rather than the single start-and-end pair the returns above use.</div></div>';
      return html;
    }

    var flags = buildEvidenceFlags(ev, fund, a.evidenceBenchmark || bench);
    html += '<div style="margin-top:6px">' + flags.map(function (f) {
      return '<div class="flag"><span class="flag-dot ' + f.level + '"></span><div class="flag-body">' +
        '<div class="flag-title">' + escapeHTML(f.title) + (f.recall ? '<span class="flag-src">recalled</span>' : '') + '</div>' +
        '<div class="flag-detail">' + escapeHTML(f.detail) + '</div></div></div>';
    }).join('') + '</div>';

    // Rolling windows across three horizons
    var rows = [['1 year', ev.rolling.r12], ['3 years', ev.rolling.r36], ['5 years', ev.rolling.r60]]
      .filter(function (r) { return r[1]; });
    if (rows.length) {
      html += '<div class="divider"></div><div class="section-label">Rolling windows vs ' + escapeHTML(a.evidenceBenchmark || bench) + '</div>';
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Window</th><th>Count</th><th>Beat rate</th><th>Median</th><th>Median excess</th><th>Worst</th></tr></thead><tbody>';
      html += rows.map(function (r) {
        var w = r[1];
        return '<tr><td>' + r[0] + '</td><td>' + w.count + '</td><td class="' + (w.beatRate >= 50 ? 'pos' : 'neg') + '">' +
          w.beatRate.toFixed(0) + '%</td><td>' + fmtPercent(w.medianFund) + '</td><td class="' + (w.medianExcess >= 0 ? 'pos' : 'neg') + '">' +
          fmtPercent(w.medianExcess) + '</td><td class="neg">' + fmtPercent(w.worst.fund) + '</td></tr>';
      }).join('');
      html += '</tbody></table></div>';
      html += '<div class="hint">Every overlapping window in the period, not a single start and end date. A high beat rate is consistency; one strong window is not.</div>';
    }

    html += '<div class="divider"></div><div class="stat-grid">';
    html += stat('Upside capture', ev.capture.upCapture == null ? '—' : ev.capture.upCapture.toFixed(0) + '%');
    html += stat('Downside capture', ev.capture.downCapture == null ? '—' : ev.capture.downCapture.toFixed(0) + '%',
      ev.capture.downCapture != null && ev.capture.downCapture < 100 ? 'pos' : 'neg');
    html += stat('Beta', ev.beta ? ev.beta.beta.toFixed(2) : '—');
    html += stat('Correlation', ev.beta && ev.beta.correlation != null ? ev.beta.correlation.toFixed(2) : '—');
    html += '</div>';

    if (fund) {
      var bits = [];
      if (fund.categoryLabel) bits.push(escapeHTML(fund.categoryLabel));
      if (fund.aumCr != null) bits.push('AUM ₹' + Math.round(fund.aumCr).toLocaleString('en-IN') + ' Cr');
      if (fund.topTenPct != null) bits.push('top 10 = ' + fund.topTenPct.toFixed(0) + '% of portfolio');
      if (bits.length) {
        html += '<div class="hint" style="margin-top:12px">' + bits.join(' · ') +
          '. Size is shown as context, not scored — a large AUM constrains a small-cap mandate but is harmless for a large-cap one, and there is no honest single threshold.</div>';
      }
    }

    html += '<div class="hint stale">Computed from estimated month-end prices, not real NAV history. Rolling windows are the robust tier — multi-year aggregates absorb price error. Capture ratios and beta are month-by-month and therefore more sensitive; read them as direction, not precision.</div>';
    html += '<div class="hint">' + ev.pairs + ' months compared, ' + escapeHTML(fmtDate(ev.from)) + ' to ' + escapeHTML(fmtDate(ev.to)) +
      '. None of this says the fund suits <em>you</em> — that turns on your horizon, what you already hold, and whether the fee is buying anything an index fund would not.</div>';
    html += '</div>';
    return html;
  }

  function renderLotBlock(ticker, stats, market, cur) {
    var h = holdingFor(ticker);
    var a = analyseLots(ticker, stats, market);
    var html = '<div class="card"><h2>Your position</h2>';
    html += '<div class="hint">Holdings and tax lots live in your brokerage, not anywhere this app can reach — so enter them here and the maths below is exact rather than recalled.</div>';

    html += (h.lots || []).map(function (l, i) {
      return '<div class="lot-row">' +
        '<div class="field"><label>Units</label><input ' + swpNumAttrs() + ' data-bind="holdings.' + ticker + '.lots.' + i + '.units" value="' + escapeHTML(String(l.units == null ? '' : l.units)) + '"></div>' +
        '<div class="field"><label>Buy price</label><input ' + swpNumAttrs() + ' data-bind="holdings.' + ticker + '.lots.' + i + '.price" value="' + escapeHTML(String(l.price == null ? '' : l.price)) + '"></div>' +
        '<div class="field"><label>Bought</label><input type="date" max="' + todayISO() + '" data-bind="holdings.' + ticker + '.lots.' + i + '.date" value="' + escapeHTML(l.date || '') + '"></div>' +
        '<button class="lot-del" data-action="remove-holding-lot" data-ticker="' + escapeHTML(ticker) + '" data-index="' + i + '" title="Remove lot">✕</button>' +
        '</div>';
    }).join('');
    html += '<div class="btn-row"><button class="secondary" data-action="add-holding-lot" data-ticker="' + escapeHTML(ticker) + '">+ Add lot</button></div>';

    if (!a.lots.length) {
      html += '<div class="hint">Add a lot with units, buy price and date to see cost basis, holding period and tax treatment.</div></div>';
      return html;
    }

    html += '<div class="divider"></div>';
    html += '<div class="field"><label>Current price ' + (a.price != null && !h.priceOverride ? '(from the price lookup — override if you have a live quote)' : '') + '</label>' +
      '<input ' + swpNumAttrs() + ' data-bind="holdings.' + ticker + '.priceOverride" value="' + escapeHTML(String(h.priceOverride)) + '" placeholder="' + (a.price != null ? String(a.price.toFixed(2)) : 'enter a price') + '"></div>';

    if (a.price == null) {
      html += '<div class="hint stale">Enter a current price to value the position — no price is cached for this ticker yet.</div></div>';
      return html;
    }

    html += '<div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr>' +
      '<th>Bought</th><th>Units</th><th>Cost</th><th>Basis</th><th>Value</th><th>Unrealised</th><th>Held</th><th>Term</th></tr></thead><tbody>';
    html += a.lots.map(function (l) {
      return '<tr><td>' + escapeHTML(fmtDate(l.date)) + '</td><td>' + l.units + '</td><td>' + fmtCurrency(l.cost, cur) +
        '</td><td>' + fmtCurrency(l.basis, cur) + '</td><td>' + fmtCurrency(l.value, cur) +
        '</td><td class="' + (l.gain >= 0 ? 'pos' : 'neg') + '">' + fmtCurrency(l.gain, cur) +
        '</td><td>' + l.months + 'mo</td><td class="' + (l.lt ? 'pos' : '') + '">' + (l.lt ? 'Long' : 'Short') + '</td></tr>';
    }).join('');
    html += '</tbody></table></div>';

    html += '<div class="stat-grid" style="margin-top:12px">';
    html += stat('Cost basis', fmtCurrency(a.totals.basis, cur));
    html += stat('Market value', fmtCurrency(a.totals.value, cur));
    html += stat('Unrealised P&L', fmtCurrency(a.totals.gain, cur), a.totals.gain >= 0 ? 'pos' : 'neg');
    html += stat('Return', fmtPercent(a.totals.basis > 0 ? a.totals.gain / a.totals.basis * 100 : 0), a.totals.gain >= 0 ? 'pos' : 'neg');
    html += '</div>';

    if (a.indian && a.tax != null) {
      html += '<div class="divider"></div><div class="section-label">If you sold everything today</div>';
      html += '<div class="stat-grid">';
      html += stat('Short-term gain', fmtCurrency(a.totals.stGain, cur), a.totals.stGain > 0 ? 'neg' : '');
      html += stat('Long-term gain', fmtCurrency(a.totals.ltGain, cur), 'pos');
      html += stat('Estimated tax', fmtCurrency(a.tax, cur), a.tax > 0 ? 'neg' : '');
      html += stat('Net after tax', fmtCurrency(a.totals.value - a.tax, cur), 'pos');
      html += '</div>';
      if (a.nextCrossing && a.saving > 0.5) {
        html += '<div class="hint stale">Lot bought ' + escapeHTML(fmtDate(a.nextCrossing.date)) + ' turns long-term on <strong>' +
          escapeHTML(fmtDate(a.nextCrossing.ltOn)) + '</strong>. Selling after every lot has crossed would cost about ' +
          fmtCurrency(a.taxIfWaited, cur) + ' instead of ' + fmtCurrency(a.tax, cur) + ' — a difference of about <strong>' +
          fmtCurrency(a.saving, cur) + '</strong>, before any price movement in the meantime.</div>';
      }
      html += '<div class="hint">Uses the editable rate panel on the SWP tab, including the annual long-term exemption. Those rates are placeholders unless you have verified them.</div>';
    } else if (!a.indian) {
      html += '<div class="hint">Holding periods and unrealised P&L only — the tax engine here encodes Indian rules, and no rate table is configured for this market.</div>';
    }
    html += '</div>';
    return html;
  }

  function renderDetailTab() {
    var d = S.top.detail, t = S.top;
    var ticker = d.ticker;
    var cur = topOption(TOP_MARKETS, t.market).currency;
    var a = S.analysis[ticker];
    var stats = detailPriceStats(ticker);
    var isFund = t.category !== 'stocks';

    var html = '<div class="card">';
    html += '<div style="display:flex;align-items:center;gap:10px;justify-content:space-between">';
    html += '<div style="min-width:0"><div class="rank-ticker" style="font-size:19px">' + escapeHTML(ticker) + '</div>' +
      (d.name ? '<div class="rank-name">' + escapeHTML(d.name) + '</div>' : '') + '</div>';
    html += '<button class="hbtn" data-action="close-analysis">← Back</button></div>';
    html += '<div class="btn-row"><button class="secondary" data-action="analysis-what-if" data-ticker="' + escapeHTML(ticker) + '">Run What-If</button>' +
      '<button class="secondary" data-action="refresh-analysis" data-ticker="' + escapeHTML(ticker) + '"' + (S.detailFetch.loading ? ' disabled' : '') + '>' +
      (S.detailFetch.loading ? '<span class="spinner"></span>Loading…' : 'Refresh') + '</button></div>';
    html += '</div>';

    html += '<div class="card"><h2>Price behaviour</h2>' + renderDetailStats(stats, cur) + '</div>';
    html += renderEvidence(ticker, t.market);

    if (a) {
      if (a.profile.business || a.profile.sector) {
        html += '<div class="card"><h2>Profile</h2>';
        if (a.profile.sector) html += '<div class="hint"><strong>' + escapeHTML(a.profile.sector) + '</strong></div>';
        if (a.profile.business) html += '<div class="hint">' + escapeHTML(a.profile.business) + '</div>';
        if (a.profile.moat) { html += '<div class="section-label" style="margin-top:12px">Competitive position</div><div class="hint">' + escapeHTML(a.profile.moat) + '</div>'; }
        if (a.profile.risks.length) {
          html += '<div class="section-label" style="margin-top:12px">Key risks</div>';
          html += '<div class="hint">' + a.profile.risks.map(function (r) { return '• ' + escapeHTML(r); }).join('<br>') + '</div>';
        }
        html += '</div>';
      }
      if (a.financials.length) {
        html += '<div class="card"><h2>Financials</h2><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th>Period</th><th>Revenue</th><th>Net income</th><th>Net margin</th></tr></thead><tbody>';
        html += a.financials.map(function (f) {
          return '<tr><td>' + escapeHTML(f.period) + '</td><td>' + escapeHTML(f.revenue || '—') + '</td><td>' +
            escapeHTML(f.netIncome || '—') + '</td><td class="' + (f.netMarginPct > 0 ? 'pos' : '') + '">' +
            (f.netMarginPct == null ? '—' : f.netMarginPct.toFixed(1) + '%') + '</td></tr>';
        }).join('');
        html += '</tbody></table></div></div>';
      }
      if (!isFund && (a.earnings.trend || a.earnings.beatMissPattern || a.earnings.typicalReportingMonths)) {
        html += '<div class="card"><h2>Earnings</h2>';
        if (a.earnings.trend) html += '<div class="hint">' + escapeHTML(a.earnings.trend) + '</div>';
        if (a.earnings.beatMissPattern) html += '<div class="hint" style="margin-top:8px">' + escapeHTML(a.earnings.beatMissPattern) + '</div>';
        if (a.earnings.typicalReportingMonths) html += '<div class="hint" style="margin-top:8px">Typically reports: ' + escapeHTML(a.earnings.typicalReportingMonths) + '. No confirmed next date — a model cannot know a future announcement.</div>';
        html += '</div>';
      }
      if (!isFund && (a.valuation.pe != null || a.valuation.pb != null || a.valuation.sectorContext)) {
        html += '<div class="card"><h2>Valuation</h2><div class="stat-grid">';
        html += stat('P/E', a.valuation.pe == null ? '—' : a.valuation.pe.toFixed(1));
        html += stat('P/B', a.valuation.pb == null ? '—' : a.valuation.pb.toFixed(1));
        html += '</div>';
        if (a.valuation.sectorContext) html += '<div class="hint">' + escapeHTML(a.valuation.sectorContext) + '</div>';
        html += '</div>';
      }
      html += '<div class="card"><div class="hint stale">⚠ Profile, financials, earnings and valuation are the model\'s training recall, not a data feed. ' +
        escapeHTML(a.model || 'The model') + ' states this covers: <strong>' + escapeHTML(a.asOf || 'period not stated') + '</strong>' +
        (a.note ? ' — ' + escapeHTML(a.note) : '') + '. Fetched ' + escapeHTML(new Date(a.fetchedAt).toLocaleString()) + '.</div></div>';
    } else if (S.detailFetch.analysisError) {
      html += '<div class="card"><h2>Analysis</h2><div class="err">' + escapeHTML(S.detailFetch.analysisError) + '</div></div>';
    } else if (S.detailFetch.loading) {
      html += '<div class="card"><div class="hint"><span class="spinner"></span>Fetching company analysis…</div></div>';
    }

    html += renderLotBlock(ticker, stats, t.market, cur);

    html += '<div class="card"><h2>Not shown, on purpose</h2><div class="hint">' +
      'This page leaves out <strong>Level II order book depth</strong> (needs a live exchange feed), ' +
      '<strong>RSI and MACD</strong> (need exact daily closes; on estimated monthly prices they would look precise and mean nothing), ' +
      '<strong>options price history</strong> (too sparse in training data to recall), and ' +
      '<strong>confirmed upcoming earnings dates</strong> (a future date cannot be in training data). ' +
      'Each of those would have to be invented to appear here, so they are absent by choice rather than oversight.</div></div>';

    return html;
  }

  function renderTopTab() {
    var t = S.top;
    if (t.detail) return renderDetailTab();
    var entry = S.topLists[topKey(t.market, t.category, t.period)];
    var html = '';

    html += '<div class="card">';
    html += '<h2>Market</h2>';
    html += '<div class="toggle-pill">' + TOP_MARKETS.map(function (m) {
      return '<button data-action="set-top-market" data-value="' + m.v + '" class="' + (t.market === m.v ? 'active' : '') + '">' + m.l + '</button>';
    }).join('') + '</div>';
    html += '<div class="divider"></div>';
    html += '<h2>Category</h2>';
    html += '<div class="toggle-pill">' + topCategoriesFor(t.market).map(function (c) {
      return '<button data-action="set-top-category" data-value="' + c.v + '" class="' + (t.category === c.v ? 'active' : '') + '">' + c.l + '</button>';
    }).join('') + '</div>';
    html += '<div class="divider"></div>';
    html += '<h2>Period</h2>';
    html += '<div class="toggle-pill">' + TOP_PERIODS.map(function (p) {
      return '<button data-action="set-top-period" data-value="' + p.v + '" class="' + (t.period === p.v ? 'active' : '') + '">' + p.l + '</button>';
    }).join('') + '</div>';
    html += '<div class="hint">Rankings come from the language model\'s training knowledge, not a live market feed — treat them as a rough, possibly out-of-date starting point for exploration. Past performance says nothing about future results, and none of this is financial advice.</div>';
    html += '<div class="btn-row"><button class="primary" data-action="fetch-top" ' + (S.topLoading ? 'disabled' : '') + '>' +
      (S.topLoading ? '<span class="spinner"></span>Loading…'
        : (entry ? 'Refresh List' : (t.category === 'swpcats' ? 'Load Top 5 per Category' : 'Load Top 10'))) + '</button></div>';
    html += '</div>';

    if (entry && entry.groups) {
      html += renderTopGroups(t, entry);
    } else if (entry) {
      html += '<div class="card">';
      html += '<h2>Top 10 · ' + escapeHTML(topOption(TOP_MARKETS, t.market).l) + ' · ' +
        escapeHTML(topOption(TOP_CATEGORIES, t.category).l) + ' · ' + topOption(TOP_PERIODS, t.period).label + '</h2>';
      html += entry.items.map(function (it, i) {
        return rankRow(it, i, 'data-action="open-analysis" data-ticker="' + escapeHTML(it.ticker) +
          '" data-name="' + escapeHTML(it.name || '') + '"');
      }).join('');
      html += '<div class="hint">Tap any row for a detailed analysis. Fetched ' + escapeHTML(new Date(entry.fetchedAt).toLocaleString()) + '.</div>';
      html += '</div>';
    } else if (!S.topLoading) {
      html += '<div class="empty">No list loaded yet.<br>Pick a market, category and period, then tap "' +
        (t.category === 'swpcats' ? 'Load Top 5 per Category' : 'Load Top 10') + '".</div>';
    }

    return html;
  }

  /* ---------------------------------------------------------------------
   * SWP planner UI. Three zones on one page: controls, the gross-vs-net
   * headline (the whole point of the tool), then detail.
   * ------------------------------------------------------------------- */
  function fmtINR(n, dec) {
    if (!Number.isFinite(n)) return '—';
    return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: dec || 0 }).format(n);
  }
  // Numeric fields deliberately use text + inputmode rather than type=number:
  // type=number forbids selectionStart, so the caret cannot be restored across the
  // live re-render and characters get dropped mid-typing. Values are kept as raw
  // strings; every engine call site already coerces with Number().
  function swpNumAttrs() { return 'type="text" inputmode="decimal" autocomplete="off"'; }
  function swpInput(label, sub, errs, opts) {
    opts = opts || {};
    var v = getPath(S.swp, sub);
    var err = errs[sub];
    var attrs = opts.type === 'date'
      ? 'type="date"' + (opts.max ? ' max="' + opts.max + '"' : '')
      : swpNumAttrs();
    return '<div class="field"><label>' + escapeHTML(label) + '</label>' +
      '<input ' + attrs + ' data-bind="swp.' + sub + '"' +
      ' value="' + escapeHTML(v == null ? '' : String(v)) + '"' + (err ? ' class="bad"' : '') + '>' +
      (err ? '<div class="err">' + escapeHTML(err) + '</div>' : '') + '</div>';
  }
  function swpSection(key, title, body) {
    var open = !!S.swp.openSections[key];
    return '<div class="card">' +
      '<button class="acc-hdr" data-action="swp-toggle-section" data-key="' + key + '" aria-expanded="' + open + '">' +
      '<span>' + escapeHTML(title) + '</span><span class="chev">▶</span></button>' +
      (open ? '<div class="acc-body">' + body + '</div>' : '') + '</div>';
  }
  function swpPill(action, list, current) {
    return '<div class="toggle-pill">' + list.map(function (o) {
      return '<button data-action="' + action + '" data-value="' + o.v + '" class="' + (current === o.v ? 'active' : '') + '">' + escapeHTML(o.l) + '</button>';
    }).join('') + '</div>';
  }

  // The warning never goes away — a model answer is still recall, not verified law.
  // It only changes wording to name who said what, and on what claimed basis.
  function renderRateProvenance(c) {
    var m = c.ratesMeta || {};
    var hasKey = !!(S.settings.url && S.settings.apiKey);
    var html = '';
    if (m.source === 'model') {
      html += '<div class="hint stale">⚠ Model-supplied from training data, not verified law. ' +
        escapeHTML(m.model || 'A model') + ' reported these as: <strong>' + escapeHTML(m.basis || 'basis not stated') + '</strong>' +
        (m.fetchedAt ? ', asked ' + escapeHTML(new Date(m.fetchedAt).toLocaleDateString()) : '') + '. ' +
        (m.note ? escapeHTML(m.note) + ' ' : '') +
        'A model cannot look up current law — check these against the current Finance Act before trusting any number below.</div>';
    } else {
      html += '<div class="hint stale">⚠ These are placeholders from training knowledge, not verified current law. Indian rates move at almost every Budget — check equity STCG/LTCG, the LTCG exemption, NRI surcharge thresholds, cess and holding periods against the current Finance Act before trusting any number below.</div>';
    }
    html += '<div class="btn-row">';
    html += '<button class="secondary" data-action="swp-fetch-rates"' + (S.swpRateFetch.loading || !hasKey ? ' disabled' : '') + '>' +
      (S.swpRateFetch.loading ? '<span class="spinner"></span>Asking…' : 'Ask the model for rates') + '</button>';
    if (m.source === 'model') html += '<button class="secondary danger" data-action="swp-reset-rates">Reset to defaults</button>';
    html += '</div>';
    if (!hasKey) html += '<div class="hint">Add a provider and API key in Settings to enable this. Everything else in this tab works offline.</div>';
    return html;
  }

  function renderRatePreview(c) {
    var p = S.swpRateFetch.preview;
    if (!p) return '';
    var diff = rateDiff(c.rates, p.rates);
    var html = '<div class="preview-box"><h3>Suggested rates — not applied yet</h3>';
    html += '<div class="hint">' + escapeHTML(p.model || 'The model') + ' says these come from: <strong>' +
      escapeHTML(p.basis || 'basis not stated') + '</strong>' + (p.note ? ' — ' + escapeHTML(p.note) : '') + '</div>';
    if (!diff.length) {
      html += '<div class="hint">Nothing differs from what you already have.</div>';
      html += '<div class="btn-row"><button class="secondary" data-action="swp-discard-rates">Close</button></div>';
    } else {
      html += '<div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Field</th><th>Current</th><th>Suggested</th></tr></thead><tbody>';
      html += diff.map(function (d) {
        return '<tr><td>' + escapeHTML(d.label) + '</td><td>' + escapeHTML(d.from) + '</td><td class="pos">' + escapeHTML(d.to) + '</td></tr>';
      }).join('');
      html += '</tbody></table></div>';
      html += '<div class="btn-row"><button class="primary" data-action="swp-apply-rates">Apply ' + diff.length + ' change' + (diff.length === 1 ? '' : 's') + '</button>' +
        '<button class="secondary" data-action="swp-discard-rates">Discard</button></div>';
    }
    html += '</div>';
    return html;
  }

  function renderSwpControls(c, errs) {
    var html = '';

    // ---- Corpus ----
    var corpus = '';
    corpus += swpPill('swp-entry-mode', [{ v: 'lump', l: 'Lump sum' }, { v: 'lots', l: 'Multiple lots' }], c.entryMode);
    corpus += '<div class="divider"></div>';
    if (c.entryMode === 'lump') {
      corpus += '<div class="row">' + swpInput('Amount invested', 'lump.amount', errs) + swpInput('NAV at purchase', 'lump.nav', errs, { step: '0.0001' }) + '</div>';
      corpus += swpInput('Purchase date', 'lump.date', errs, { type: 'date', max: todayISO() });
    } else {
      corpus += (c.lots || []).map(function (l, i) {
        return '<div class="lot-row">' +
          '<div class="field"><label>Units</label><input ' + swpNumAttrs() + ' data-bind="swp.lots.' + i + '.units" value="' + escapeHTML(String(l.units)) + '"></div>' +
          '<div class="field"><label>NAV</label><input ' + swpNumAttrs() + ' data-bind="swp.lots.' + i + '.nav" value="' + escapeHTML(String(l.nav)) + '"></div>' +
          '<div class="field"><label>Purchased</label><input type="date" data-bind="swp.lots.' + i + '.date" value="' + escapeHTML(l.date || '') + '" max="' + todayISO() + '"></div>' +
          (c.lots.length > 1 ? '<button class="lot-del" data-action="swp-remove-lot" data-index="' + i + '" title="Remove lot">✕</button>' : '') +
          '</div>';
      }).join('');
      if (errs.lots) corpus += '<div class="err">' + escapeHTML(errs.lots) + '</div>';
      corpus += '<div class="btn-row"><button class="secondary" data-action="swp-add-lot">+ Add lot</button></div>';
    }
    corpus += '<div class="divider"></div>';
    corpus += '<div class="row">' + swpInput('Current NAV', 'currentNav', errs, { step: '0.0001' }) +
      '<div class="field"><label>Fund category</label><select data-bind="swp.category">' + SWP_CATEGORIES.map(function (x) {
        return '<option value="' + x.v + '"' + (c.category === x.v ? ' selected' : '') + '>' + escapeHTML(x.l) + '</option>';
      }).join('') + '</select></div></div>';
    corpus += '<div class="hint">Corpus today: <strong>' + fmtINR(swpCorpusValue(c)) + '</strong> · ' +
      swpLots(c).reduce(function (s, l) { return s + l.units; }, 0).toFixed(3) + ' units</div>';
    corpus += '<div class="divider"></div>';
    corpus += '<div class="section-label">Expected annual return</div>';
    corpus += '<div class="row">' + swpInput('Pessimistic %', 'returns.pess', errs, { step: '0.1' }) +
      swpInput('Base %', 'returns.base', errs, { step: '0.1' }) + swpInput('Optimistic %', 'returns.opt', errs, { step: '0.1' }) + '</div>';
    corpus += '<div class="checkrow" style="margin-top:12px"><input type="checkbox" id="swp-vol" data-bind="swp.volatility.enabled"' + (c.volatility.enabled ? ' checked' : '') + '><label for="swp-vol">Run a Monte Carlo on volatility</label></div>';
    if (c.volatility.enabled) corpus += '<div style="margin-top:10px">' + swpInput('Annual volatility (std dev %)', 'volatility.stdev', errs, { step: '0.1' }) + '</div>';
    html += swpSection('corpus', 'Corpus', corpus);

    // ---- Withdrawal ----
    var wd = '';
    wd += swpPill('swp-amount-mode', [{ v: 'net', l: 'Net (what I receive)' }, { v: 'gross', l: 'Gross (units sold)' }], c.amountMode);
    wd += '<div class="hint">Net mode solves backwards for the redemption that credits this much <em>after</em> TDS — the thing most calculators skip.</div>';
    wd += '<div class="divider"></div>';
    wd += '<div class="row">' + swpInput('Amount per instalment', 'amount', errs) +
      '<div class="field"><label>Frequency</label><select data-bind="swp.frequency">' + SWP_FREQS.map(function (f) {
        return '<option value="' + f.v + '"' + (c.frequency === f.v ? ' selected' : '') + '>' + f.l + '</option>';
      }).join('') + '</select></div></div>';
    wd += '<div class="row">' + swpInput('Start date', 'startDate', errs, { type: 'date' }) + swpInput('Horizon (years)', 'horizonYears', errs) + '</div>';
    wd += swpInput('Annual escalation %', 'escalation', errs, { step: '0.1' });
    html += swpSection('withdrawal', 'Withdrawal', wd);

    // ---- Tax & residency ----
    var tx = '';
    tx += '<div class="section-label">Residency</div>';
    tx += swpPill('swp-residency', [{ v: 'nri', l: 'NRI' }, { v: 'resident', l: 'Resident' }], c.residency);
    tx += '<div class="checkrow" style="margin-top:12px"><input type="checkbox" id="swp-trans" data-bind="swp.transitionEnabled"' + (c.transitionEnabled ? ' checked' : '') + '><label for="swp-trans">I change residency mid-plan</label></div>';
    if (c.transitionEnabled) {
      tx += '<div style="margin-top:10px">' + swpInput('Transition date (NRI before, resident on/after)', 'transitionDate', errs, { type: 'date' }) + '</div>';
    }
    tx += '<div class="divider"></div>';
    tx += '<div class="section-label">Tax rates</div>';
    tx += renderRateProvenance(c);
    tx += renderRatePreview(c);
    tx += '<div class="row">' + swpInput('Equity STCG %', 'rates.eqStcg', errs, { step: '0.1' }) + swpInput('Equity LTCG %', 'rates.eqLtcg', errs, { step: '0.1' }) + '</div>';
    tx += '<div class="row">' + swpInput('LTCG annual exemption', 'rates.ltcgExemption', errs) + swpInput('Debt / slab %', 'rates.debtSlab', errs, { step: '0.1' }) + '</div>';
    tx += '<div class="row">' + swpInput('Cess %', 'rates.cess', errs, { step: '0.1' }) + swpInput('Equity holding (months)', 'rates.eqHoldMonths', errs) + '</div>';
    tx += swpInput('Other-asset holding (months)', 'rates.otherHoldMonths', errs);
    tx += '<div class="hint">NRI surcharge: ' + (c.rates.surcharge || []).map(function (s) {
      return s.pct + '% over ' + fmtINR(s.over);
    }).join(', ') + ' — applied on cumulative gains within each financial year, with cess on top.</div>';
    tx += '<div class="divider"></div>';
    tx += '<div class="checkrow"><input type="checkbox" id="swp-197" data-bind="swp.sec197.enabled"' + (c.sec197.enabled ? ' checked' : '') + '><label for="swp-197">Sec 197 lower/nil deduction certificate</label></div>';
    if (c.sec197.enabled) tx += '<div style="margin-top:10px">' + swpInput('Certificate rate %', 'sec197.rate', errs, { step: '0.01' }) + '</div>';
    tx += '<div class="checkrow" style="margin-top:12px"><input type="checkbox" id="swp-dtaa" data-bind="swp.dtaa.enabled"' + (c.dtaa.enabled ? ' checked' : '') + '><label for="swp-dtaa">DTAA relief</label></div>';
    if (c.dtaa.enabled) tx += '<div style="margin-top:10px">' + swpInput('Treaty rate %', 'dtaa.rate', errs, { step: '0.01' }) + '</div>';
    if (c.sec197.enabled || c.dtaa.enabled) tx += '<div class="hint">An override replaces the whole deduction — base rate, surcharge and cess included.</div>';
    tx += '<div class="divider"></div>';
    tx += '<div class="section-label">Exit load</div>';
    tx += '<div class="row">' + swpInput('Load %', 'exitLoad.pct', errs, { step: '0.01' }) + swpInput('Applies within (days)', 'exitLoad.days', errs) + '</div>';
    html += swpSection('tax', 'Tax & residency', tx);

    return html;
  }

  function renderSwpHeadline(c, runs) {
    var base = runs.base, first = base.ledger[0];
    if (!first) return '<div class="empty">This plan redeems nothing — check the corpus and withdrawal amount.</div>';
    var deduction = first.exitLoad + first.tds;
    var netPct = first.gross > 0 ? Math.max(0, first.net) / first.gross * 100 : 0;
    var year1 = base.ledger.filter(function (r) { return r.i < swpFreq(c).perYear; });
    var y1 = year1.reduce(function (a, r) { return { g: a.g + r.gross, d: a.d + r.exitLoad + r.tds, n: a.n + r.net }; }, { g: 0, d: 0, n: 0 });

    var html = '<div class="card">';
    html += '<h2>What actually reaches you</h2>';
    html += '<div class="gap-viz">';
    html += '<div class="gap-row"><span class="gap-lbl">Gross redemption</span><span class="gap-gross">' + fmtINR(first.gross) + '</span></div>';
    html += '<div class="gap-bar"><i class="net" style="width:' + netPct.toFixed(2) + '%"></i><i class="ded" style="width:' + (100 - netPct).toFixed(2) + '%"></i></div>';
    html += '<div class="gap-ded">− ' + fmtINR(deduction) + ' deducted &nbsp;·&nbsp; TDS ' + fmtINR(first.tds) + ' · exit load ' + fmtINR(first.exitLoad) + '</div>';
    html += '<div class="gap-net-row"><span class="gap-lbl">Lands in your bank</span><span class="gap-net">' + fmtINR(first.net) + '</span></div>';
    html += '</div>';
    html += '<div class="hint">First instalment (' + escapeHTML(fmtDate(first.date)) + '), ' + escapeHTML(swpFreq(c).l.toLowerCase()) + '.' +
      (first.tds === 0 ? ' No TDS on this one — the LTCG annual exemption still covers the gain, so the gap opens later in the year.' : '') + '</div>';

    // The first instalment can be deduction-free while the exemption lasts, so the
    // first full year is the honest headline figure for the gap.
    html += '<div class="divider"></div>';
    html += '<div class="section-label">First 12 months</div>';
    html += '<div class="stat-grid">';
    html += stat('Redeemed', fmtINR(y1.g));
    html += stat('Deducted', fmtINR(y1.d), y1.d > 0 ? 'neg' : '');
    html += stat('Received', fmtINR(y1.n), 'pos');
    html += stat('Lost to deduction', (y1.g > 0 ? (y1.d / y1.g * 100).toFixed(2) : '0.00') + '%', y1.d > 0 ? 'neg' : '');
    html += '</div>';

    html += '<div class="divider"></div>';
    html += '<div class="section-label">How long the corpus lasts</div>';
    html += '<div class="stat-grid">';
    [['pess', 'Pessimistic'], ['base', 'Base'], ['opt', 'Optimistic']].forEach(function (p) {
      var out = runs[p[0]];
      html += stat(p[1] + ' · ' + Number(c.returns[p[0]]) + '%',
        out.survives ? 'Survives' : fmtDate(out.depletion), out.survives ? 'pos' : 'neg');
    });
    html += stat('Ending balance (base)', fmtINR(runs.base.endingValue), runs.base.survives ? 'pos' : '');
    html += '</div>';

    if (c.transitionEnabled && c.transitionDate) {
      var asNri = runSwp(Object.assign({}, c, { transitionEnabled: false, residency: 'nri' }), Number(c.returns.base));
      var asRes = runSwp(Object.assign({}, c, { transitionEnabled: false, residency: 'resident' }), Number(c.returns.base));
      var sumNet = function (o) { return o.ledger.reduce(function (s, r) { return s + r.net; }, 0); };
      html += '<div class="divider"></div>';
      html += '<div class="section-label">Same plan, either status</div>';
      html += '<div class="stat-grid">';
      html += stat('Total received as NRI', fmtINR(sumNet(asNri)));
      html += stat('Total received as resident', fmtINR(sumNet(asRes)), 'pos');
      html += stat('Cost of NRI status', fmtINR(sumNet(asRes) - sumNet(asNri)), 'neg');
      html += stat('Transition', fmtDate(c.transitionDate));
      html += '</div>';
      html += '<div class="hint">Resident figures are what is credited; the tax still falls due at ITR time rather than being withheld per instalment.</div>';
    }
    html += '</div>';
    return html;
  }

  function renderSwpChart(c, runs) {
    var series = [
      { key: 'pess', color: '#f43f5e', out: runs.pess },
      { key: 'base', color: '#818cf8', out: runs.base },
      { key: 'opt', color: '#22c55e', out: runs.opt }
    ];
    var maxLen = Math.max.apply(null, series.map(function (s) { return s.out.ledger.length; }));
    if (maxLen < 2) return '<div class="empty">Not enough instalments to chart.</div>';
    var maxVal = Math.max.apply(null, series.map(function (s) {
      return Math.max.apply(null, s.out.ledger.map(function (r) { return r.remainingValue; }).concat([0]));
    }));
    if (!(maxVal > 0)) maxVal = 1;
    var W = 600, H = 220, pad = 30;
    var xAt = function (i) { return pad + (i / Math.max(1, maxLen - 1)) * (W - 2 * pad); };
    var yAt = function (v) { return H - pad - (v / maxVal) * (H - 2 * pad); };

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Corpus over time under three return scenarios">';
    svg += '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="#2a3350"/>';

    if (c.transitionEnabled && c.transitionDate) {
      var ti = runs.base.ledger.findIndex(function (r) { return r.date >= c.transitionDate; });
      if (ti > 0) {
        svg += '<line x1="' + xAt(ti).toFixed(1) + '" y1="' + pad + '" x2="' + xAt(ti).toFixed(1) + '" y2="' + (H - pad) +
          '" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>';
        svg += '<text x="' + (xAt(ti) + 4).toFixed(1) + '" y="' + (pad + 10) + '" font-size="9" fill="#f59e0b">residency change</text>';
      }
    }
    series.forEach(function (s) {
      var d = s.out.ledger.map(function (r, i) { return (i ? 'L' : 'M') + xAt(i).toFixed(1) + ',' + yAt(r.remainingValue).toFixed(1); }).join(' ');
      svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2"/>';
      if (!s.out.survives && s.out.ledger.length) {
        var li = s.out.ledger.length - 1;
        svg += '<circle cx="' + xAt(li).toFixed(1) + '" cy="' + yAt(s.out.ledger[li].remainingValue).toFixed(1) + '" r="3.5" fill="' + s.color + '"/>';
      }
    });
    svg += '<text x="' + pad + '" y="14" font-size="10" fill="#8b93ab">' + escapeHTML(fmtINR(maxVal)) + '</text>';
    svg += '<text x="' + pad + '" y="' + (H - 8) + '" font-size="10" fill="#8b93ab">' + escapeHTML(fmtDate(runs.base.ledger[0].date)) + '</text>';
    svg += '<text x="' + (W - pad) + '" y="' + (H - 8) + '" font-size="10" fill="#8b93ab" text-anchor="end">+' + Math.round(maxLen / swpFreq(c).perYear) + 'y</text>';
    svg += '</svg>';
    return svg;
  }

  var SWP_LEDGER_COLS = [
    ['Date', function (r) { return fmtDate(r.date); }],
    ['NAV', function (r) { return r.nav.toFixed(2); }],
    ['Gross', function (r) { return fmtINR(r.gross); }],
    ['Units', function (r) { return r.units.toFixed(3); }],
    ['Cost', function (r) { return fmtINR(r.cost); }],
    ['ST gain', function (r) { return fmtINR(r.stGain); }],
    ['LT gain', function (r) { return fmtINR(r.ltGain); }],
    ['Exempt', function (r) { return fmtINR(r.exemptionUsed); }],
    ['Load', function (r) { return fmtINR(r.exitLoad); }],
    ['TDS', function (r) { return fmtINR(r.tds); }],
    ['Net', function (r) { return fmtINR(r.net); }],
    ['Units left', function (r) { return r.remainingUnits.toFixed(3); }],
    ['Value left', function (r) { return fmtINR(r.remainingValue); }]
  ];

  function renderSwpDetail(c, runs) {
    var base = runs.base;
    var html = '<div class="card"><h2>Corpus over time</h2>';
    html += '<div class="chart-wrap">' + renderSwpChart(c, runs) + '</div>';
    html += '<div class="legend"><span><i style="background:#f43f5e"></i>Pessimistic</span><span><i style="background:#818cf8"></i>Base</span><span><i style="background:#22c55e"></i>Optimistic</span></div>';
    html += '</div>';

    // Ledger
    var rows = c.ledgerExpanded ? base.ledger : base.ledger.slice(0, 24);
    html += '<div class="card"><h2>Instalment ledger</h2>';
    html += '<div class="tbl-wrap"><table class="tbl" id="swp-ledger"><thead><tr>' +
      SWP_LEDGER_COLS.map(function (col) { return '<th>' + escapeHTML(col[0]) + '</th>'; }).join('') + '</tr></thead><tbody>';
    html += rows.map(function (r) {
      return '<tr>' + SWP_LEDGER_COLS.map(function (col, ci) {
        var cls = col[0] === 'TDS' && r.tds > 0 ? ' class="neg"' : col[0] === 'Net' ? ' class="pos"' : '';
        return '<td' + cls + '>' + escapeHTML(String(col[1](r))) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    html += '</tbody></table></div>';
    html += '<div class="hint">Showing ' + rows.length + ' of ' + base.ledger.length + ' instalments (base scenario).</div>';
    html += '<div class="btn-row">';
    if (base.ledger.length > 24) html += '<button class="secondary" data-action="swp-toggle-ledger">' + (c.ledgerExpanded ? 'Show first 24' : 'Show all ' + base.ledger.length) + '</button>';
    html += '<button class="secondary" data-action="swp-export-csv">Export CSV</button></div>';
    html += '</div>';

    // Annual reconciliation
    var ann = swpAnnualSummary(base.ledger);
    html += '<div class="card"><h2>Annual reconciliation</h2>';
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Year</th><th>Gross</th><th>ST gain</th><th>LT gain</th><th>Exempt</th><th>TDS paid</th><th>Liability</th><th>Refund</th></tr></thead><tbody>';
    html += ann.map(function (e) {
      return '<tr><td>' + escapeHTML(finYearLabel(e.fy)) + '</td><td>' + fmtINR(e.gross) + '</td><td>' + fmtINR(e.stGain) +
        '</td><td>' + fmtINR(e.ltGain) + '</td><td>' + fmtINR(e.exemptionUsed) + '</td><td>' + fmtINR(e.tds) +
        '</td><td>' + fmtINR(e.liability) + '</td><td class="' + (e.refund >= 0 ? 'pos' : 'neg') + '">' + fmtINR(e.refund) + '</td></tr>';
    }).join('');
    html += '</tbody></table></div>';
    html += '<div class="hint">Refund = TDS withheld minus the liability once the annual LTCG exemption is applied. For an NRI drawing steadily this is usually positive — money you get back at ITR time.</div>';
    html += '</div>';

    // Sensitivity
    var sens = swpSensitivity(c);
    var horizon = Number(c.horizonYears) || 1;
    html += '<div class="card"><h2>Sensitivity</h2>';
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Draw ↓ / Return →</th>' +
      SWP_SENS_R.map(function (r) { return '<th>' + r + '%</th>'; }).join('') + '</tr></thead><tbody>';
    html += SWP_SENS_W.map(function (w, wi) {
      return '<tr><td>' + w + '%</td>' + sens[wi].map(function (yrs) {
        var t = yrs == null ? 1 : Math.min(1, yrs / horizon);
        var bg = 'hsla(' + Math.round(t * 140) + ',70%,45%,.32)';
        return '<td class="heat" style="background:' + bg + '">' + (yrs == null ? '∞' : yrs.toFixed(1)) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    html += '</tbody></table></div>';
    html += '<div class="hint">Years until the corpus is exhausted, by annual withdrawal rate (% of today\'s corpus) against annual return. ∞ means it outlasts the ' + horizon + '-year horizon. Computed on gross withdrawals.</div>';
    html += '</div>';
    return html;
  }

  function renderSwpTab() {
    var c = S.swp;
    var errs = validateSwp(c);
    var html = renderSwpControls(c, errs);
    if (Object.keys(errs).length) {
      html += '<div class="empty">Fix the highlighted inputs above to see results.</div>';
      return html;
    }
    var runs = {
      pess: runSwp(c, Number(c.returns.pess)),
      base: runSwp(c, Number(c.returns.base)),
      opt: runSwp(c, Number(c.returns.opt))
    };
    html += renderSwpHeadline(c, runs);

    var maxW = swpMaxSustainable(c, Number(c.returns.base));
    html += '<div class="card"><h2>Sustainability</h2><div class="stat-grid">';
    html += stat('Max sustainable / instalment', fmtINR(maxW), 'pos');
    html += stat('You are drawing', fmtINR(Number(c.amount)), Number(c.amount) > maxW ? 'neg' : 'pos');
    if (c.volatility.enabled) {
      html += stat('Survival probability', swpMonteCarlo(c, 500).toFixed(0) + '%');
      html += stat('Monte Carlo', '500 paths · σ ' + Number(c.volatility.stdev) + '%');
    }
    html += '</div><div class="hint">Largest ' + escapeHTML(swpFreq(c).l.toLowerCase()) + ' withdrawal (' +
      (c.amountMode === 'net' ? 'net of TDS' : 'gross') + ') that still leaves the corpus intact at the horizon, at the base return.' +
      (c.volatility.enabled ? ' Monte Carlo redraws the return every instalment, so it captures sequence-of-returns risk rather than just an average.' : '') + '</div></div>';

    html += renderSwpDetail(c, runs);
    return html;
  }

  function swpExportCsv() {
    var c = S.swp;
    if (Object.keys(validateSwp(c)).length) { toast('error', 'Fix the highlighted inputs first.'); return; }
    var out = runSwp(c, Number(c.returns.base));
    var head = ['Date', 'FinancialYear', 'NAV', 'Gross', 'Units', 'CostBasis', 'STGain', 'LTGain',
      'ExemptionUsed', 'ExitLoad', 'TDS', 'Liability', 'NetCredit', 'RemainingUnits', 'RemainingValue'];
    var lines = [head.join(',')].concat(out.ledger.map(function (r) {
      return [r.date, finYearLabel(r.fy), r.nav.toFixed(4), r.gross.toFixed(2), r.units.toFixed(4),
        r.cost.toFixed(2), r.stGain.toFixed(2), r.ltGain.toFixed(2), r.exemptionUsed.toFixed(2),
        r.exitLoad.toFixed(2), r.tds.toFixed(2), r.liability.toFixed(2), r.net.toFixed(2),
        r.remainingUnits.toFixed(4), r.remainingValue.toFixed(2)].join(',');
    }));
    var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'swp-ledger.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('success', 'Exported ' + out.ledger.length + ' instalments.');
  }

  function renderHistoryTab() {
    if (S.scenarios.length === 0) return '<div class="empty">No saved scenarios yet.<br>Run a what-if and tap "Save Scenario" to keep it here.</div>';
    var html = '';
    S.scenarios.forEach(function (sc) {
      var b = sc.result.base;
      var cls = b.gainAbs >= 0 ? 'pos' : 'neg';
      html += '<div class="scenario-item" data-action="load-scenario" data-id="' + sc.id + '">';
      html += '<div class="top"><span class="ticker">' + escapeHTML(sc.draft.ticker) + '</span><span class="badge ' + cls + '">' + fmtPercent(b.gainPct) + '</span></div>';
      html += '<div class="meta">' + (sc.draft.mode === 'dca' ? 'DCA' : 'Lump sum') + ' · ' + escapeHTML(sc.draft.assetType) + ' · sold ' + fmtDate(sc.draft.sellDate) + '</div>';
      html += '<div class="meta">Invested ' + fmtCurrency(b.investedTotal, sc.draft.currency) + ' → ' + fmtCurrency(b.currentValue, sc.draft.currency) + '</div>';
      html += '<div class="actions"><button class="secondary danger" data-action="delete-scenario" data-id="' + sc.id + '">Delete</button></div>';
      html += '</div>';
    });
    return html;
  }

  function renderSettingsTab() {
    var s = S.settings;
    var provider = providerOf(s.provider);
    var html = '<div class="card">';
    html += '<h2>LLM Endpoint (price oracle)</h2>';
    html += '<div class="field"><label>Provider</label><select data-bind="settings.provider">' + PROVIDER_ORDER.map(function (key) {
      return '<option value="' + key + '"' + (s.provider === key ? ' selected' : '') + '>' + PROVIDERS[key].label + '</option>';
    }).join('') + '</select></div>';
    var urlPlaceholder = provider.defaultUrl || 'https://…';
    var keyPlaceholder = provider.style === 'anthropic' ? 'sk-ant-…' : provider.style === 'gemini' ? 'AIza…' : 'sk-…';
    html += '<div class="field"><label>URL</label><input type="text" data-bind="settings.url" value="' + escapeHTML(s.url) + '" placeholder="' + escapeHTML(urlPlaceholder) + '"></div>';
    var modelHint = provider.style === 'gemini'
      ? 'Gemini\'s API embeds the model directly in the URL path (<code>…/models/&lt;model&gt;:generateContent</code>) — just edit that segment to switch models.'
      : 'There\'s no separate Model field — append <code>?model=&lt;name&gt;</code> to the end of the URL. It\'s stripped off before the request is sent and placed in the request body where the API expects it.';
    html += '<div class="field"><label>API Key</label><input type="password" data-bind="settings.apiKey" value="' + escapeHTML(s.apiKey) + '" placeholder="' + keyPlaceholder + '"></div>';
    html += '<div class="hint">' + modelHint + '</div>';
    var authHint = provider.style === 'gemini' ? 'an <code>x-goog-api-key</code> header'
      : provider.style === 'anthropic' ? 'an <code>x-api-key</code> header (plus the browser-access header Anthropic requires for direct client-side calls)'
      : 'an <code>Authorization: Bearer</code> header';
    html += '<div class="hint">Requests go straight from your browser to the URL above with ' + authHint + ' — nothing passes through a server you don\'t control. Some providers block direct browser (CORS) requests entirely; if calls fail immediately with a network error, that\'s the provider\'s CORS policy, not a bug here, and there\'s no backend in this app to route around it. Choosing "Custom" targets any OpenAI-compatible <code>/chat/completions</code> endpoint (local servers, other gateways, etc.).</div>';
    html += '<div class="btn-row"><button class="secondary" data-action="test-connection" ' + (S.loading ? 'disabled' : '') + '>Test Connection</button></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h2>Data</h2>';
    html += '<div class="hint">Looked-up prices are cached locally so re-running or reloading a scenario doesn\'t re-query the model. ' + Object.keys(S.priceCache).length + ' price points cached.</div>';
    html += '<div class="btn-row"><button class="secondary danger" data-action="clear-cache">Clear Price Cache</button></div>';
    html += '</div>';

    html += '<div class="card"><h2>About</h2><div class="hint">Everything here — settings, scenarios, cached prices — lives only in this browser\'s localStorage. There is no backend and no database. The LLM is used solely as a historical price lookup; all return, DCA, and gain/loss math is computed locally in JavaScript.</div></div>';
    return html;
  }

  /* ---------------------------------------------------------------------
   * Top-level render
   * ------------------------------------------------------------------- */
  var TABS = [
    { v: 'new', l: 'New', ic: '＋' },
    { v: 'top', l: 'Top 10', ic: '★' },
    { v: 'swp', l: 'SWP', ic: '₹' },
    { v: 'history', l: 'History', ic: '☰' },
    { v: 'settings', l: 'Settings', ic: '⚙' }
  ];

  function renderHeader() {
    var titles = { new: 'What-If', top: 'Top 10', swp: 'SWP Planner', history: 'History', settings: 'Settings' };
    return '<header class="topbar"><div class="brand"><span class="dot"></span>Playground · ' + titles[S.tab] + '</div></header>';
  }

  function renderBottomNav() {
    return '<nav class="bottomnav">' + TABS.map(function (t) {
      return '<button class="nav-btn ' + (S.tab === t.v ? 'active' : '') + '" data-action="set-tab" data-value="' + t.v + '"><span class="ic">' + t.ic + '</span>' + t.l + '</button>';
    }).join('') + '</nav>';
  }

  function render() {
    var body = S.tab === 'new' ? renderNewTab()
      : S.tab === 'top' ? renderTopTab()
      : S.tab === 'swp' ? renderSwpTab()
      : S.tab === 'history' ? renderHistoryTab()
      : renderSettingsTab();
    // Re-rendering replaces innerHTML, which would drop focus mid-keystroke on the
    // live-recalculating SWP inputs — so carry focus and caret across the swap.
    var active = document.activeElement;
    var focusKey = active && active.dataset ? active.dataset.bind : null;
    var scrollTop = 0;
    var prevMain = document.querySelector('#app main');
    if (prevMain) scrollTop = prevMain.scrollTop;
    var selStart = null, selEnd = null;
    if (focusKey) { try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) { /* number/date inputs disallow selection */ } }

    document.getElementById('app').innerHTML =
      renderHeader() +
      '<main class="scroll">' + body + '</main>' +
      renderBottomNav();

    var newMain = document.querySelector('#app main');
    if (newMain && scrollTop) newMain.scrollTop = scrollTop;
    if (focusKey) {
